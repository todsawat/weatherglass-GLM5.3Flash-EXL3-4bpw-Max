    } else b.bank = app(b.bank, 0, dt * 4);
    if (b.st === 'settle') {
      b.flap = app(b.flap, 0.5 + Math.sin(T * 2.2 * TAU * 0.2 + b.seed) * 0.45, dt * 3);
      b.vx *= Math.pow(0.02, dt); b.vz *= Math.pow(0.02, dt); b.vy *= Math.pow(0.02, dt);
      b.rest -= dt;
      if (b.rest <= 0) { b.st = 'fly'; b.target = bflyPoint(); b.vy = 0.6; b.rest = rr(2, 7); }
    } else {
      b.flap = 0.55 + Math.sin(b.wphase) * 0.5;
      b.wphase += dt * (26 + Math.sin(T * 2 + b.seed) * 6);
      if (b.rise <= 0 && d < 0.35 && Math.abs(ay) < 0.8 && E.wind < 0.45) {
        b.st = 'settle'; b.target = { x: b.x, y: Math.max(0.72, b.y - 0.16), z: b.z }; b.rest = rr(2, 7);
      }
      if (hyp(b.x - tgt.x, b.z - tgt.z) < 0.3 && b.st !== 'settle') b.target = bflyPoint();
      if (tgt.y > 1.6 && b.y > 1.9) tgt.y = rr(0.9, 1.9);
    }
  }
  function clampSign(v, m) { return v > 0 ? Math.min(v, m) : Math.max(v, -m); }

  /* ---------------------------------------------------------------- dragonflies */
  function makeDfl() {
    return {
      x: lake.x0 + rr(0.3, 1.2), y: rr(0.45, 0.95), z: lake.z0 + rr(0.3, 1.4),
      vx: 0, vy: 0, vz: 0, yaw: rr(-3, 3), a: 0, dead: false, dying: false, t: 0,
      seed: rr(0, 90), col: ri(0, 1), dart: rr(0.8, 2.5), rest: 0, tilt: 0, vib: rr(0, TAU)
    };
  }
  function spawnDfl() {
    let d = null;
    for (let i = 0; i < dflies.length; i++) if (dflies[i].dead) { d = dflies[i]; break; }
    if (!d) { d = makeDfl(); dflies.push(d); }
    const nd = makeDfl();
    for (const k in nd) d[k] = nd[k];
    d.dead = false; d.dying = false; d.a = 0;
  }
  function pickDfl() {
    for (let i = 0; i < dflies.length; i++) {
      const d = dflies[i];
      if (!d.dead && !d.dying) { d.dying = true; return; }
    }
  }
  function updDfl(d, dt) {
    d.t += dt;
    d.a = app(d.a, d.dying ? 0 : 1, dt * 1.8);
    if (d.dying && d.a <= 0.001) { d.dead = true; return; }
    d.dart -= dt;
    if (d.dart <= 0) {
      d.dart = rr(2.2, 5.5);
      d.rest = rnd() < 0.35 ? rr(0.5, 1.3) : 0;
      d.tvx = rr(-1, 1) * 3.4; d.tvz = rr(-1, 1) * 3.4; d.tvy = rr(-0.5, 0.6);
    }
    let ax = 0, ay = 0, az = 0;
    if (d.rest > 0) {
      d.rest -= dt;
      d.vx *= Math.pow(0.05, dt); d.vz *= Math.pow(0.05, dt); d.vy *= Math.pow(0.05, dt);
      const wn = T * 5 + d.seed;
      ax = noise(wn, d.seed) * 3; az = noise(wn + 21, d.seed) * 3; ay = noise(wn + 43, d.seed) * 2.4;
    } else {
      ax = (d.tvx || 0) * 4.5; az = (d.tvz || 0) * 4.5; ay = (d.tvy || 0) * 4;
    }
    // stay over the shallows
    const cx = (lake.x0 + lake.x1) * 0.5, cz = (lake.z0 + lake.z1) * 0.5;
    ax += (cx - d.x) * 0.5; az += (cz - d.z) * 0.5;
    if (d.x < lake.x0 - 0.7) ax += 3; if (d.x > lake.x1 + 0.7) ax -= 3;
    if (d.z < lake.z0 - 0.7) az += 3; if (d.z > lake.z1 + 0.7) az -= 3;
    if (d.y < 0.28) ay += 5; if (d.y > 1.5) ay -= 4;
    d.vx += ax * dt; d.vy += ay * dt; d.vz += az * dt;
    const damp = Math.pow(0.03, dt);
    d.vx *= damp; d.vy *= damp; d.vz *= damp;
    const sp = hyp(d.vx, d.vz), smax = 2.9;
    if (sp > smax) { d.vx = d.vx / sp * smax; d.vz = d.vz / sp * smax; }
    d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    d.x = cl(d.x, lake.x0 - 0.9, lake.x1 + 0.9); d.z = cl(d.z, lake.z0 - 0.9, lake.z1 + 0.9);
    d.y = cl(d.y, 0.22, 1.7);
    const hs = hyp(d.vx, d.vz);
    if (hs > 0.07) {
      const want = yawOf(d.vx, d.vz), dy = wrap(want - d.yaw);
      d.yaw += dy * Math.min(1, dt * 10);
      d.tilt = app(d.tilt, cl(-dy * 5 + Math.cos(d.t * 2.4 + d.seed) * 0.09, -0.5, 0.5), dt * 5);
    } else d.tilt = app(d.tilt, Math.cos(d.t * 2.4 + d.seed) * 0.09, dt * 4);
    d.vib += dt * 70;
  }

  /* ---------------------------------------------------------------- fireflies */
  function makeFF() {
    return {
      x: rr(-5, 5), y: rr(0.6, 2.4), z: rr(-3.1, 3.2), vx: rr(-0.06, 0.06), vz: rr(-0.06, 0.06),
      vy: rr(-0.03, 0.03), a: 0, dead: false, dying: false, ph: rr(0, TAU), per: rr(3.6, 7.5),
      seed: rr(0, 90), size: rr(0.65, 1.35)
    };
  }
  function spawnFF() {
    let f = null;
    for (let i = 0; i < fireflies.length; i++) if (fireflies[i].dead) { f = fireflies[i]; break; }
    if (!f) { f = makeFF(); fireflies.push(f); }
    const nf = makeFF();
    for (const k in nf) f[k] = nf[k];
    f.dead = false; f.dying = false; f.a = 0;
  }
  function pickFF() {
    let f = null, ba = 0;
    for (let i = 0; i < fireflies.length; i++) {
      const q = fireflies[i];
      if (q.dead || q.dying) continue;
      if (q.a > ba) { ba = q.a; f = q; }
    }
    if (f) f.dying = true;
  }
  function updFF(f, dt) {
    f.a = app(f.a, f.dying ? 0 : 1, dt * 0.9);
    if (f.dying && f.a <= 0.001) { f.dead = true; return; }
    const wn = T * 0.35 + f.seed;
    f.vx += noise(wn, f.seed) * 0.1 * dt * 10;
    f.vy += noise(wn + 33, f.seed) * 0.08 * dt * 10;
    f.vz += noise(wn + 61, f.seed) * 0.1 * dt * 10;
    if (f.y < 0.55) f.vy += 0.5 * dt; if (f.y > 2.7) f.vy -= 0.4 * dt;
    f.vx = cl(f.vx, -0.28, 0.28); f.vy = cl(f.vy, -0.16, 0.16); f.vz = cl(f.vz, -0.28, 0.28);
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    f.x = cl(f.x, -5.2, 5.2); f.z = cl(f.z, -3.3, 3.4); f.y = cl(f.y, 0.5, 2.9);
    f.ph += dt * (TAU / f.per) * (0.75 + 0.5 * Math.sin(f.seed));
    f.pulse = Math.pow(Math.max(0, Math.sin(f.ph)), 3);
  }
  function fireflyGate() {
    const springLate = E.w[0] * sstep(0.12, 0.2, E.season) * (1 - sstep(0.24, 0.3, E.season));
    const gate = E.night ? 1 : E.nightF * 0.9;
    const temp = sstep(8, 14, E.temp);
    const calm = 1 - sstep(0.3, 0.55, E.wind);
    return gate * temp * calm * Math.max(sstep(0.3, 0.75, E.w[1]), springLate * 0.7);
  }

  /* ---------------------------------------------------------------- fish */
  const school = { x: 3, z: 1.8, tx: 3, tz: 1.8, t: 0, turnT: 4, bolt: 0, ripple: 4, bvx: 0, bvz: 0 };
  function resetSchool() {
    school.x = (lake.x0 + lake.x1) * 0.5; school.z = (lake.z0 + lake.z1) * 0.5;
    school.tx = school.x; school.tz = school.z; school.t = 0; school.bolt = 0; school.ripple = rr(2, 5);
    school.bvx = school.bvz = 0; school.turnT = rr(3, 6);
  }
  function makeFish(i, n) {
    return {
      x: school.x, y: -0.6, z: school.z, vx: 0, vy: 0, vz: 0, yaw: rr(-3, 3), a: 0, dead: false, dying: false,
      seed: rr(0, 90), col: (i % 3 === 2) ? 1 : 0, st: 'swim', t: 0, wag: rr(0, TAU),
      slotA: (i / Math.max(1, n)) * TAU + rr(-0.4, 0.4), slotR: 0.35 + rnd() * 1.15, slotY: rr(-0.35, 0.3), size: rr(0.85, 1.15)
    };
  }
  function spawnFish() {
    let f = null;
    for (let i = 0; i < fishes.length; i++) if (fishes[i].dead) { f = fishes[i]; break; }
    if (!f) { f = makeFish(fishes.length, fishes.length + 2); fishes.push(f); }
    const nf = makeFish(ri(0, 8), 9);
    for (const k in nf) f[k] = nf[k];
    f.dead = false; f.dying = false; f.a = 0;
    f.x = school.x + Math.cos(f.slotA) * f.slotR; f.z = school.z + Math.sin(f.slotA) * f.slotR * 0.6;
    f.y = rr(fishBot() + 0.02, fishTop() - 0.02);
  }
  function pickFish() {
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      if (!f.dead && !f.dying) { f.dying = true; return; }
    }
  }
  function fishTop() { return E.frozen > 0.6 ? -0.19 : -0.05; }
  function fishBot() { return Math.min(lake.y0 + 0.09, -0.12); }
  function updFish(f, dt) {
    f.t += dt;
    f.a = app(f.a, f.dying ? 0 : 1, dt * 1.5);
    if (f.dying && f.a <= 0.001) { f.dead = true; return; }
    const slow = (E.night ? 0.45 : 1) * (1 - E.frozen * 0.55) * (school.bolt > 0 ? 4.5 : 1);
    const ang = school.t * 0.7 + f.slotA;
    const tx = school.x + Math.cos(ang) * f.slotR * 0.85;
    const tz = school.z + Math.sin(ang) * f.slotR * 0.5;
    let ty = (fishBot() + fishTop()) * 0.5 + f.slotY * 0.1;
    if (f.st === 'rise') ty = fishTop();
    if (E.frozen > 0.6) ty = Math.min(ty, -0.16);
    let ax = tx - f.x, ay = ty - f.y, az = tz - f.z;
    const d = hyp(ax, az) || 0.001;
    const force = 1.7 * slow;
    ax = (ax / d) * force; az = (az / d) * force; ay = cl(ay * 2.6, -1.4, 1.4) * slow;
    ax += noise(T * 0.9 + f.seed, f.seed) * 0.9;
    az += noise(T * 0.9 + f.seed + 17, f.seed) * 0.9;
    if (school.bolt > 0) { ax += school.bvx; az += school.bvz; }
    // keep inside the lake box
    const mx = 0.25, mz = 0.25;
    if (f.x < lake.x0 + mx) ax += (lake.x0 + mx - f.x) * 6;
    if (f.x > lake.x1 - mx) ax -= (f.x - (lake.x1 - mx)) * 6;
    if (f.z < lake.z0 + mz) az += (lake.z0 + mz - f.z) * 6;
    if (f.z > lake.z1 - mz) az -= (f.z - (lake.z1 - mz)) * 6;
    f.vx += ax * dt; f.vy += ay * dt; f.vz += az * dt;
    const damp = Math.pow(0.2, dt);
    f.vx *= damp; f.vy *= damp; f.vz *= damp;
    const sp = hyp(f.vx, f.vz), smax = 0.45 * slow;
    if (sp > smax) { f.vx = f.vx / sp * smax; f.vz = f.vz / sp * smax; }
    if (hyp(f.vx, f.vz) < 0.04) { const hv = headV(f.yaw); f.vx += hv[0] * dt * 0.5; f.vz += hv[1] * dt * 0.5; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    f.x = cl(f.x, lake.x0 + 0.25, lake.x1 - 0.25);
    f.z = cl(f.z, lake.z0 + 0.25, lake.z1 - 0.25);
    f.y = cl(f.y, fishBot(), fishTop());
    const hs = hyp(f.vx, f.vz);
    if (hs > 0.02) {
      const want = yawOf(f.vx, f.vz), dy = wrap(want - f.yaw);
      f.yaw += dy * Math.min(1, dt * 3.4);
    }
    f.wag += dt * (6 + hs * 14);
    if (f.st === 'rise') {
      if (f.y > fishTop() - 0.06) {
        if (WG.spawn) { try { WG.spawn('ripple', f.x, 0.105, f.z, { size: rr(0.1, 0.22), life: rr(1.2, 2.0), fish: true }); } catch (e) { WG.err(e); } }
        f.st = 'dive';
      }
    } else if (f.st === 'dive') {
      f.vy -= 0.9 * dt;
      if (f.y < (fishBot() + fishTop()) * 0.5 - 0.05) f.st = 'swim';
    }
  }

  /* ---------------------------------------------------------------- dust */
  function makeDust() {
    return {
      x: rr(-4.8, 4.8), y: rr(1.3, 5.4), z: rr(-3.1, 3.1), vx: 0, vy: 0, vz: 0,
      a: 0, dead: false, dying: false, ph: rr(0, TAU), per: rr(1.6, 4.2), size: rr(0.6, 1.4)
    };
  }
  function spawnDust() {
    let d = null;
    for (let i = 0; i < dusts.length; i++) if (dusts[i].dead) { d = dusts[i]; break; }
    if (!d) { d = makeDust(); dusts.push(d); }
    const nd = makeDust();
    if (sunX() > 0) nd.x = rr(0.4, 4.9); else if (sunX() < 0) nd.x = rr(-4.9, -0.4);
    for (const k in nd) d[k] = nd[k];
    d.dead = false; d.dying = false; d.a = 0;
  }
  function pickDust() {
    for (let i = 0; i < dusts.length; i++) {
      const d = dusts[i];
      if (!d.dead && !d.dying) { d.dying = true; return; }
    }
  }
  function sunX() {
    const s = (WG.sky && WG.sky.sunDir) || (WG.scene && WG.scene.sunDir);
    return s && typeof s[0] === 'number' ? s[0] : 0.55;
  }
  function updDust(d, dt) {
    d.a = app(d.a, d.dying ? 0 : 1, dt * 0.8);
    if (d.dying && d.a <= 0.001) { d.dead = true; return; }
    d.vx += Math.sin(T * 0.3 + d.ph) * 0.012 * dt * 6;
    d.vz += Math.cos(T * 0.27 + d.ph) * 0.012 * dt * 6;
    d.vy += (0.02 - d.vy) * dt * 0.4;
    d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    d.ph += dt * (TAU / d.per);
    if (d.x < -5.2 || d.x > 5.2 || d.y > 6 || d.y < 0.8 || d.z < -3.4 || d.z > 3.4) d.dying = true;
  }

  /* ---------------------------------------------------------------- population manager */
  const spawnT = { bird: 0, bfly: 0, dfl: 0, ff: 0, fish: 0, dust: 0 };
  function manage(kind, list, want, dt, spawnFn, pickFn) {
    let live = 0, dying = 0;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.dead) continue;
      if (e.dying) dying++; else live++;
    }
    const wantI = Math.min(Math.round(want), list === birds ? maxOf('bird') + 2 : maxOf(kind));
    if (live < wantI) {
      spawnT[kind] -= dt;
      if (spawnT[kind] <= 0) {
        spawnT[kind] = kind === 'ff' ? 0.035 : kind === 'dust' ? 0.07 : 0.16;
        spawnFn();
      }
    }
    if (live > wantI) {
      spawnT[kind] = Math.max(spawnT[kind], 0);
      if (dying < live - wantI) pickFn();
    }
    extra[kind] = Math.max(0, (extra[kind] || 0) - dt * 0.35);
  }

  /* ---------------------------------------------------------------- gates */
  function wantBirds() {
    // autumn thins the flock a little, winter keeps it (they sit); night keeps it (they roost)
    const w = maxOf('bird') * (1 - E.w[2] * 0.18 - E.w[3] * 0.12);
    return cl(w, Math.max(3, maxOf('bird') * 0.7), maxOf('bird')) + (extra.bird | 0);
  }
  function wantBflies() {
    const g = (E.w[0] + E.w[1]) * sstep(11.5, 15, E.temp) * (1 - sstep(0.34, 0.55, E.wind)) *
      sstep(0.18, 0.5, E.dl) * (1 - E.wet * 0.8);
    return maxOf('bfly') * g + extra.bfly;
  }
  function wantDflies() {
    const g = sstep(0.35, 0.7, E.w[1]) * sstep(0.2, 0.55, E.dl) * sstep(14, 18, E.temp) *
      (1 - sstep(0.3, 0.6, E.frozen)) * (1 - E.wet * 0.6);
    return maxOf('dfl') * g + extra.dfl;
  }
  function wantFF() { return maxOf('ff') * fireflyGate() + extra.ff; }
  function wantFish() { return maxOf('fish') * (0.55 + 0.45 * (1 - E.frozen * 0.7)) + extra.fish; }
  function wantDust() {
    const g = sstep(0.45, 0.8, E.dl) * (1 - sstep(0.45, 0.7, E.humid)) * (1 - E.wet * 1.4) *
      (1 - sstep(0.3, 0.6, E.cloud)) * (1 - sstep(0.35, 0.7, E.snow)) * (1 - sstep(0.35, 0.7, E.wind));
    return maxOf('dust') * cl(g, 0, 1);
  }

  /* ---------------------------------------------------------------- draw */
  function drawAll() {
    /* birds */
    if (C.bird) {
      for (let i = 0; i < birds.length; i++) {
        const b = birds[i];
        if (b.dead) continue;
        const al = Math.min(b.a, alive.bird);
        if (al < 0.02) continue;
        const s = b.size, perched = b.st === 'perch';
        const ya = b.yaw, body = trs([b.x, b.y, b.z], [b.pitch, ya, b.bank], [SB[0] * s, SB[1] * s, SB[2] * s]);
        push('birdBody', MATB, body, BIRD_COL[b.col], { alpha: al, sway: perched ? 0.4 : 0 });
        if (b.belly && C.sphere) {
          push('sphere', MATB, trs([b.x, b.y + 0.02 * s, b.z], [b.pitch, ya, b.bank],
            [0.03 * s, 0.02 * s, 0.05 * s]), BELLY, { alpha: al });
        }
        const wa = Math.sin(b.phase) * b.amp * (perched ? 0.14 : 1);
        // perched: wing lifted to vertical, then laid back along the spine so it reads as folded
        const wx = perched ? b.pitch - 1.32 : b.pitch;
        const wxR = -wx;
        const wsc = perched ? 0.52 : 1;
        const rx = Math.cos(ya) * 0.05 * s, rz = -Math.sin(ya) * 0.05 * s;
        const wy = b.y + (perched ? 0.085 : 0.1) * s, wr = b.bank + wa + (perched ? 1.44 : 0);
        const wm = [SW[0] * s * wsc, SW[1] * s * wsc, SW[2] * s * wsc];
        push('birdWing', MATB, trs([b.x + rx, wy, b.z + rz], [wx, ya, wr], wm), BIRD_WING[b.col], { alpha: al });
        push('birdWing', MATB, trs([b.x - rx, wy, b.z - rz], [wxR, ya + Math.PI, wr], wm), BIRD_WING[b.col], { alpha: al });
      }
    }
    /* butterflies */
    if (C.bfly) {
      for (let i = 0; i < bflies.length; i++) {
        const b = bflies[i];
        if (b.dead) continue;
        const al = Math.min(b.a, alive.bfly);
        if (al < 0.02) continue;
        const s = b.size;
        const open = b.st === 'settle' ? b.flap * 0.9 + 0.25 : 0.22 + b.flap * 0.85;
        const col = BF_COL[b.col], ya = b.yaw;
        push('butterflyWing', MATB, trs([b.x, b.y, b.z], [0.2, ya, b.bank + open], [BF_W[0] * s, BF_W[1] * s, BF_W[2] * s]),
          col, { alpha: al });
        push('butterflyWing', MATB, trs([b.x, b.y, b.z], [0.2, ya + Math.PI, b.bank + open], [BF_W[0] * s, BF_W[1] * s, BF_W[2] * s]),
          col, { alpha: al });
        if (C.sphere && (b.col === 0 || (b.col === 2 && N() >= 3))) {
          const rx = Math.cos(ya) * 0.05 * s, rz = -Math.sin(ya) * 0.05 * s;
          const tip = b.col === 2 ? 0.012 : 0.015;
          push('sphere', MATB, trs([b.x + rx, b.y + 0.006, b.z + rz], [0, ya, 0], [tip, 0.01, tip]), BF_TIP, { alpha: al });
          push('sphere', MATB, trs([b.x - rx, b.y + 0.006, b.z - rz], [0, ya, 0], [tip, 0.01, tip]), BF_TIP, { alpha: al });
        }
      }
    }
    /* dragonflies */
    if (C.dfl) {
      for (let i = 0; i < dflies.length; i++) {
        const d = dflies[i];
        if (d.dead) continue;
        const al = Math.min(d.a, alive.dfl);
        if (al < 0.02) continue;
        const col = DF_COL[d.col];
        const ya = d.yaw;
        push('dragonflyBody', MATB, trs([d.x, d.y, d.z], [0, ya, d.tilt], [DF_B[0], DF_B[1], DF_B[2]]), col, { alpha: al });
        const wA = 0.06 + Math.sin(d.vib) * 0.16;
        push('dragonflyWing', MATB, trs([d.x, d.y + 0.02, d.z], [0, ya + 0.2, d.tilt + wA], DF_W), DGW, { alpha: al * 0.5 });
        push('dragonflyWing', MATB, trs([d.x, d.y + 0.02, d.z], [0, ya + Math.PI - 0.2, d.tilt + wA], DF_W), DGW, { alpha: al * 0.5 });
      }
    }
    /* fireflies */
    if (C.ff) {
      for (let i = 0; i < fireflies.length; i++) {
        const f = fireflies[i];
        if (f.dead) continue;
        const p = f.pulse == null ? 0 : f.pulse;
        const al = Math.min(f.a, alive.ff) * (0.05 + p) * (darkT > 0 ? 0.09 : 1);
        if (al < 0.012) continue;
        const sz = FF_S * f.size * (0.7 + p * 0.6);

    }

      for (let i = 0; i < fishes.length; i++) {

          [FI[0] * s, FI[1] * s, FI[2] * s]), f.col ? FISH_O : FISH_S, { alpha: al });

          push('sphere', MATB, trs([f.x, f.y + 0.03 * s, f.z], [0, yaw, 0], [0.02 * s, 0.01 * s, 0.055 * s]),

    if (C.dust) {

        const al = Math.min(d.a, alive.dust) * tw * 0.6;
        if (al < 0.015) continue;
        const sz = DU_S * d.size;

  /* ---------------------------------------------------------------- frame */

  function update(dt) {

      calibrate();
      readEnv();
      lake = lakeBox();
      if (!started) init();
      const det = N();
      if (det !== lastDetail) { lastDetail = det; rebuild(); }
      capsT -= dt;
      if (capsT <= 0) { capsT = 0.4; refreshCaps(); }
      if (E.flash > 0.3 && darkT <= 0) { darkT = rr(3, 4); flush(0.8); }
      if (darkT > 0) darkT -= dt;
      if (splashT > 0) splashT -= dt;
      if (E.harsh && flock.mode === 'cruise' && flock.cool <= 0) tryDescend(true);

      // global kind fades
      alive.bird = app(alive.bird, 1, dt * 0.6);
      alive.bfly = app(alive.bfly, wantBflies() > 0.4 ? 1 : 0, dt * 1.2);
      alive.dfl = app(alive.dfl, wantDflies() > 0.3 ? 1 : 0, dt * 1.2);
      alive.ff = app(alive.ff, wantFF() > 2 ? 1 : 0, dt * 1.2);
      alive.fish = app(alive.fish, 1, dt * 0.6);
      alive.dust = app(alive.dust, wantDust() > 1 ? 1 : 0, dt * 1.1);

      // respawn when a gate opens again
      const bo = wantBflies() > 0.4, fo = wantFF() > 2;
      if (bo && !bfWasOpen) for (let i = 0; i < 4; i++) spawnBfly();
      if (fo && !ffWasOpen) for (let i = 0; i < 12; i++) spawnFF();
      bfWasOpen = bo; ffWasOpen = fo;
      if (E.frozen > 0.55 && !frozenWas) fishToDepth();
      frozenWas = E.frozen > 0.55;

      updFlock(dt);
      manage('bird', birds, wantBirds(), dt, spawnBird, pickBird);
      for (let i = 0; i < birds.length; i++) if (!birds[i].dead) updBird(birds[i], dt);
      manage('bfly', bflies, wantBflies(), dt, spawnBfly, pickBfly);
      for (let i = 0; i < bflies.length; i++) if (!bflies[i].dead) updBfly(bflies[i], dt);
      manage('dfl', dflies, wantDflies(), dt, spawnDfl, pickDfl);
      for (let i = 0; i < dflies.length; i++) if (!dflies[i].dead) updDfl(dflies[i], dt);

      manage('ff', fireflies, wantFF(), dt, spawnFF, pickFF);
      for (let i = 0; i < fireflies.length; i++) if (!fireflies[i].dead) updFF(fireflies[i], dt);

      // school brain
      school.t += dt;
      school.bolt = Math.max(0, school.bolt - dt);
      school.turnT -= dt;
      if (school.turnT <= 0) { school.turnT = rr(3, 6); school.t = 0; }
      if (rnd() < dt * 0.35) {

      school.ripple -= dt;
      if (school.ripple <= 0) {

      for (let i = 0; i < fishes.length; i++) if (!fishes[i].dead) updFish(fishes[i], dt);

  function rebuild() {
    try {

      if (splashT > 0) return;

    } catch (e) { WG.err(e); }
  }

  function reset() {
    try {
      for (let i = 0; i < birds.length; i++) birds[i].dead = true;
      for (let i = 0; i < bflies.length; i++) bflies[i].dead = true;
      for (let i = 0; i < dflies.length; i++) dflies[i].dead = true;
      for (let i = 0; i < fireflies.length; i++) fireflies[i].dead = true;
      for (let i = 0; i < fishes.length; i++) fishes[i].dead = true;
      for (let i = 0; i < dusts.length; i++) dusts[i].dead = true;
      birds = birds.slice(0, maxOf('bird') + 2);
      fishes = fishes.slice(0, maxOf('fish'));
      resetFlock();
      resetSchool();
      darkT = 0;
      extra.bird = extra.bfly = extra.dfl = extra.ff = extra.fish = 0;
      alive.bird = alive.fish = 1;
      alive.bfly = alive.dfl = alive.ff = alive.dust = 0;
      lastDetail = N();
      for (let i = 0; i < maxOf('bird'); i++) spawnBird();
      for (let i = 0; i < maxOf('fish'); i++) spawnFish();
    } catch (e) { WG.err(e); }
  }

  function flush(power) {
    try { flushBirds(power); } catch (e) { WG.err(e); }
  }

  function pop(n, kind) {
    try {
      if (typeof n === 'string') { const t = n; n = kind; kind = t; }
      n = cl(Math.round(num(n, 3)), 1, 40);
      if (!kind || kind === 'butterfly' || kind === 'butterflies') { extra.bfly = (extra.bfly || 0) + n; scatterBflies(); }
      else if (kind === 'bird' || kind === 'birds') { extra.bird = (extra.bird || 0) + n; flushBirds(1); }
      else if (kind === 'firefly' || kind === 'fireflies') extra.ff = (extra.ff || 0) + n;
      else if (kind === 'fish') extra.fish = (extra.fish || 0) + n;
      else if (kind === 'dragonfly' || kind === 'dragonflies') extra.dfl = (extra.dfl || 0) + n;
    } catch (e) { WG.err(e); }
  }

  AN.init = function () { init(); };
  AN.update = function (dt) { update(dt); };

    } catch (e) { WG.err(e); }
  };

  AN.reset = function () { reset(); };
  AN.pop = function (n, kind) { pop(n, kind); };

    var py = Math.min(31, Math.max(2, HZ - e * CURVE));
    if (Math.abs(px - lastOrbX) > 0.15 || Math.abs(py - lastOrbY) > 0.15) {
      lastOrbX = px; lastOrbY = py;
      $orb.style.left = (px / W * 100).toFixed(3) + '%';
      $orb.style.top = py + 'px';
    }
    var sunOp = clamp01(0.5 + e * 4), moonOp = clamp01(0.5 - e * 4);
    if ($orb.firstElementChild.style.opacity !== sunOp.toFixed(2)) {
      $orb.firstElementChild.style.opacity = sunOp.toFixed(2);
      $orb.lastElementChild.style.opacity = moonOp.toFixed(2);
    }

    var temp = Math.round(isFinite(s.temperature) ? s.temperature : 0);
    if (temp !== lastTemp) { lastTemp = temp; $temp.textContent = (temp < 0 ? '\u2212' : '') + Math.abs(temp) + '\u00b0'; }
    if (s.weather !== lastWx) { lastWx = s.weather; $wx.textContent = s.weather || ''; }
    if (s.seasonName !== lastSeasonName) {
      lastSeasonName = s.seasonName;
      $sname.textContent = s.seasonName || '';
      $dial.setAttribute('aria-valuetext', s.seasonName || '');
      $dial.setAttribute('aria-valuenow', s.season.toFixed(3));
    }

    var a = s.season * Math.PI * 2;
    if (Math.abs(a - lastKnobA) > 0.001) {
      lastKnobA = a;
      $knob.style.transform = 'translate3d(' + (Math.sin(a) * 40).toFixed(2) + 'px,' + (-Math.cos(a) * 40).toFixed(2) + 'px,0)';
    }
    var near = Math.round(s.season * 4) % 4;
    if (near !== lastNear) {
      lastNear = near;
      $syms.forEach(function (b) { var on = +b.dataset.s === near; b.classList.toggle('near', on); b.classList.toggle('on', on); });
      $face.style.setProperty('--glow', hexA(COL[near], 0.34));
    }

    if (WG.controlsHidden !== state.hidden) applyHidden(WG.controlsHidden);
    if (WG.muted !== undefined && !!WG.muted !== state.muted) applyMuted(WG.muted);
    if (WG.playingTime !== undefined && !!WG.playingTime !== state.playing) applyPlaying(WG.playingTime);
  }
  function hexA(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  /* fallback loop while the engine does not call WG.ui.update yet */
  (function loop() {
    var now = performance.now();
    if (now - (ui._t || 0) > 130) tick();
    requestAnimationFrame(loop);
  })();

  /* ------------------------------------------------------------------ mode + resize */
  function updateMode() {
    state.touch = !!WG.touch || (matchMedia && matchMedia('(pointer: coarse)').matches);
    state.small = innerWidth <= 720;
    hud.classList.toggle('touch', !!state.touch);
    if (!state.small) closeDrawer();
    placeMarker(false, false);
  }
  addEventListener('resize', updateMode);
  if (matchMedia) {
    var mq = matchMedia('(pointer: coarse)');
    if (mq.addEventListener) mq.addEventListener('change', function (e) { WG.touch = e.matches; updateMode(); });
  }
  if (window.visualViewport) {
    var vvSet = function () {
      try {
        var vv = window.visualViewport;
        var kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
        document.documentElement.style.setProperty('--kb', kb + 'px');
      } catch (e) {}
    };
    visualViewport.addEventListener('resize', vvSet);
    visualViewport.addEventListener('scroll', vvSet);
  }
  updateMode();
  placeMarker(false, false);

  /* ------------------------------------------------------------------ keys */
  addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (typing()) return;
    var k = e.key;
    if (k === 'u' || k === 'U') { e.preventDefault(); setVisible(state.hidden); return; }
    if (k === 'Escape') { if ($drawer.classList.contains('open')) { e.preventDefault(); closeDrawer(); } return; }
    var idx = '12345'.indexOf(k);
    if (idx < 0) idx = ['h', 'w', 'c', 'f', 'g'].indexOf(k.toLowerCase());
    if (idx >= 0) { e.preventDefault(); pickTool(TOOLS[idx].id); }
  });

  WG.events.on('reset', function () {
    hints.slice().forEach(function (r) { removeHint(r.id); });
    applyTool(WG.tool || 'hand');
  });

  window.WG_UI_DEBUG = { hint: hint, tipStep: tipStep, setVisible: setVisible };
})();

/* ===== 85_input.js ===== */
/* 85_input.js — pointer, keys, tools, raycasting */
(function () {
  const M = WG.m, I = WG.input = {};
  let drag = null, last = null, downT = 0, wheelAcc = 0;
  let shakeDir = 0, shakeFlip = 0, shakeT = 0;
  const cv = () => document.getElementById('gl');

  function ray(px, py) {
    const R = WG.R;
    const nx = (px / innerWidth) * 2 - 1, ny = -((py / innerHeight) * 2 - 1);
    const inv = M.invert(WG.cam.viewProj);
    const a = M.xformPoint(inv, [nx, ny, -1]), b = M.xformPoint(inv, [nx, ny, 1]);
    return { o: WG.cam.pos.slice(), d: M.norm(M.sub(b, a)) };
  }
  function hitCloud(r) {
    let best = null, bd = 1e9;
    for (const cl of WG.clouds.list) {
      if (cl.alpha < 0.25) continue;
      const oc = M.sub([cl.x, cl.y, cl.z], r.o);
      const t = M.dot(oc, r.d);
      if (t < 0) continue;
      const d = M.len(M.sub(oc, M.scale(r.d, t)));
      if (d < cl.r * 1.15 && t < bd) { bd = t; best = cl; }
    }
    return best;
  }
  function hitPlanePoint(r, y) {
    if (Math.abs(r.d[1]) < 1e-4) return null;
    const t = (y - r.o[1]) / r.d[1];
    if (t < 0) return null;
    return [r.o[0] + r.d[0] * t, y, r.o[2] + r.d[2] * t];
  }
  function inCase(p) { return p && Math.abs(p[0]) < 6 && Math.abs(p[2]) < 4; }
  function hitSphere(r, c, rad) {
    const oc = M.sub(c, r.o);
    const t = M.dot(oc, r.d);
    if (t < 0) return false;
    return M.len(M.sub(oc, M.scale(r.d, t))) < rad;
  }

  function sunHit(r) {
    const sunP = [WG.sky.sunDir[0] * 13, 3.6 + WG.sky.sunDir[1] * 13, WG.sky.sunDir[2] * 13];
    const moonP = [WG.sky.moonDir[0] * 13, 3.6 + WG.sky.moonDir[1] * 13, WG.sky.moonDir[2] * 13];
    if (hitSphere(r, sunP, 1.35) && WG.sky.elev > -0.15) return 'sun';
    if (hitSphere(r, moonP, 1.5) && WG.sky.moonElev > -0.1) return 'moon';
    return null;
  }

  function treeHit(r) {
    let best = null, bd = 1e9;
    for (const t of WG.flora.trees) {
      const p = [t.p[0], t.p[1] - t.h * 0.5, t.p[2]];
      const oc = M.sub(p, r.o);
      const tt = M.dot(oc, r.d);
      if (tt < 0 || tt > bd) continue;
      const d = M.len(M.sub(oc, M.scale(r.d, tt)));
      if (d < 0.35) { bd = tt; best = t; }
    }
    return best;
  }

  function paneHit(r) {
    // nearest wall plane in front of the camera
    const zs = [3.97, -3.97], xs = [5.97, -5.97];
    let best = null;
    for (const z of zs) {
      const t = (z - r.o[2]) / r.d[2];
      if (t > 0.4) {
        const p = [r.o[0] + r.d[0] * t, r.o[1] + r.d[1] * t, z];
        if (Math.abs(p[0]) < 6 && p[1] > -1.8 && p[1] < 7.4 && (!best || t < best.t)) best = { t, p, pane: z > 0 ? 0 : 1, axis: 'z' };
      }
    }
    for (const x of xs) {
      const t = (x - r.o[0]) / r.d[0];
      if (t > 0.4) {
        const p = [x, r.o[1] + r.d[1] * t, r.o[2] + r.d[2] * t];
        if (Math.abs(p[2]) < 4 && p[1] > -1.8 && p[1] < 7.4 && (!best || t < best.t)) best = { t, p, pane: x > 0 ? 2 : 3, axis: 'x' };
      }
    }
    return best;
  }

  function splash(p) {
    if (!p) return;
    const y = WG.land.h(p[0], p[2]);
    const lake = WG.land.lakeMask(p[0], p[2]);
    if (lake > -0.05) {
      if (WG.state.frozen > 0.55) {
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * 6.283;
          for (let k = 1; k < 5; k++) {
            WG.spawn('spray', p[0] + Math.cos(a) * k * 0.07, 0.12, p[2] + Math.sin(a) * k * 0.06, { vx: Math.cos(a) * 1.2, vy: 0.5 + Math.random(), vz: Math.sin(a) * 1.2, life: 0.5, size: 0.02, ground: 0.1 });
          }
        }
        if (WG.audio) WG.audio.event('iceCrack');
        return;
      }
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * 6.283, sp = 0.5 + Math.random() * 1.8;
        WG.spawn('spray', p[0], 0.12, p[2], { vx: Math.cos(a) * sp, vy: 1.4 + Math.random() * 2.4, vz: Math.sin(a) * sp, life: 0.75, size: 0.035, ground: 0.1 });
      }
      for (let i = 0; i < 3; i++) setTimeout(() => WG.spawn('ring', p[0], 0.115, p[2], { life: 1.6, size: 0.3 + i * 0.18 }), i * 130);
      WG.spawn('splash', p[0], 0.14, p[2], { vy: 0.9, life: 0.6, size: 0.14 });
      WG.events.emit('splash', { x: p[0], z: p[2] });
      if (WG.animals) WG.animals.pop(3, 'fish');
      if (WG.audio) WG.audio.event('splash', { x: p[0] / 6 });
    } else if (y > -1) {
      for (let i = 0; i < 7; i++) WG.spawn('spray', p[0], y + 0.03, p[2], { vx: (Math.random() - 0.5) * 0.8, vy: 0.7 + Math.random(), vz: (Math.random() - 0.5) * 0.8, life: 0.5, size: 0.022, ground: y });
      if (WG.audio) WG.audio.event('splash', { x: p[0] / 6 });
    }
  }

  function onDown(e) {
    if (e.target !== cv()) return;
    if (WG.audio && !WG.audio.ready) WG.audio.init();
    if (!WG.tutStarted) { WG.tutStarted = true; WG.events.emit('tut:start'); }
    const r = ray(e.clientX, e.clientY);
    downT = WG.time;
    last = [e.clientX, e.clientY];
    shakeFlip = 0; shakeT = 0;
    if (e.button === 1) { drag = { mode: 'pan' }; return; }
    if (e.button === 2 || e.shiftKey) { drag = { mode: 'orbit' }; return; }

    if (WG.tool === 'hand') {
      const s = sunHit(r);
      if (s) {
        drag = { mode: 'sun', which: s };
        WG.events.emit(s === 'sun' ? 'firstSunTouch' : 'firstMoonTouch');
        if (s === 'sun') WG.events.emit('tut:sun');
        if (WG.audio) WG.audio.event('chime');
        return;
      }
      const cl = hitCloud(r);
      if (cl) { WG.clouds.grab(cl); drag = { mode: 'cloud', cl }; return; }
      const tr = treeHit(r);
      if (tr) { drag = { mode: 'tree', tr, base: tr.p.slice() }; WG.audio && WG.audio.event('treeShake'); return; }
      const gh = gaugeHit(e);
      if (gh) { WG.sim.tapGauge(); return; }
      const pt = hitPlanePoint(r, 0.12);
      if (inCase(pt) && (WG.time - (I.lastSplash || 0) > 0.12)) {
        splash(pt); I.lastSplash = WG.time; return;
      }
      drag = { mode: 'orbit' };
      return;
    }
    if (WG.tool === 'wind') {
      drag = { mode: 'wind', px: e.clientX, py: e.clientY };
      return;
    }
    if (WG.tool === 'cloud') {
      const cl = hitCloud(r);
      const p = hitPlanePoint(r, 5.0);
      if (cl) { drag = { mode: 'feed', cl }; }
      else if (p && Math.abs(p[0]) < 5.6 && Math.abs(p[2]) < 3.5) {
        const ncl = WG.clouds.spawn(M.clamp(p[0], -5.4, 5.4), 4.2 + Math.random() * 1.6, M.clamp(p[2], -3.4, 3.4), 0.12);
        ncl.alpha = 0.15; ncl.r = 0.35;
        if (WG.audio) WG.audio.event('pop');
        drag = { mode: 'feed', cl: ncl };
      } else drag = { mode: 'orbit' };
      return;
    }
    if (WG.tool === 'fog') { drag = { mode: 'fog', p: e.clientX }; return; }
    if (WG.tool === 'wipe') {
      const ph = paneHit(r);
      drag = { mode: 'wipe', pane: ph ? ph.pane : 0 };
      WG.events.emit('wiped');
      return;
    }
    drag = { mode: 'orbit' };
  }

  function gaugeHit(e) {
    // project the gauge centre
    const p = [2.75, -2.40, 4.42];
    const s = M.xformPoint(WG.cam.viewProj, p);
    const sx = (s[0] * 0.5 + 0.5) * innerWidth, sy = (-s[1] * 0.5 + 0.5) * innerHeight;
    return Math.hypot(e.clientX - sx, e.clientY - sy) < 26;
  }

  function onMove(e) {
    if (!drag) { hover(e); return; }
    const dx = e.clientX - last[0], dy = e.clientY - last[1];
    last = [e.clientX, e.clientY];
    const r = ray(e.clientX, e.clientY);
    switch (drag.mode) {
      case 'orbit': WG.cam.orbit(dx, dy); break;
      case 'pan': WG.cam.pan(dx, dy); break;
      case 'sun': {
        const p = hitPlanePoint(r, 3.6) || [0, 0, 0];
        const az = Math.atan2(p[0] - WG.cam.target[0], p[2] - WG.cam.target[2]);
        let day = (az + 70 * Math.PI / 180) / (104 * Math.PI / 180);
        const ang = Math.atan2(p[1] - 3.6, Math.hypot(p[0], p[2]));
        day = drag.which === 'moon' ? day - 0.5 : day;
        WG.state.time = M.wrap(6 + day * 12, 0, 24);
        WG.events.emit('time', WG.state.time);
        break;
      }
      case 'cloud': {
        const p = hitPlanePoint(r, drag.cl.y);
        if (p) { drag.cl.tx = M.clamp(p[0], -5.4, 5.4); drag.cl.tz = M.clamp(p[2], -3.4, 3.4); }
        const md = Math.sign(dx);
        if (Math.abs(dx) > 4) {
          if (shakeDir && md !== shakeDir) { shakeFlip++; }
          shakeDir = md;
          drag.cl.shake = Math.min(1.2, drag.cl.shake + Math.abs(dx) * 0.0035);
          if (shakeFlip > 4 && !drag.cl.charged) {
            drag.cl.charged = true;
            drag.cl.charge = 1;
            WG.clouds.strike(drag.cl);
            WG.events.emit('tut:shake');
            if (WG.audio) WG.audio.event('static');
          }
        }
        break;
      }
      case 'tree': {
        const tgt = drag.tr.p;
        const p = hitPlanePoint(r, tgt[1]) || [tgt[0], tgt[1], tgt[2]];
        drag.tr.pull = [p[0] - drag.base[0], p[2] - drag.base[2]];
        break;
      }
      case 'wind': {
        const sp = Math.hypot(e.clientX - drag.px, e.clientY - drag.py);
        drag.px = e.clientX; drag.py = e.clientY;
        const p = hitPlanePoint(r, 1.0);
        if (p && sp > 2) {
          WG.sim.windStroke(sp / 30);
          for (let i = 0; i < 3; i++) WG.spawn('mist', p[0] + (Math.random() - 0.5) * 0.4, 0.3 + Math.random() * 0.5, p[2] + (Math.random() - 0.5) * 0.4, { life: 0.7, size: 0.18 });
          if (WG.audio) WG.audio.event('windStroke', { speed: Math.min(1, sp / 26), x: p[0] / 6 });
          WG.events.emit('tut:windOn');
        }
        break;
      }
      case 'fog': {
        const p = hitPlanePoint(r, 0.4);
        if (p && inCase(p)) {
          drag.holdT = (drag.holdT || 0) + 0.016;
          WG.state.fog = M.sat(WG.state.fog + 0.006);
          for (let i = 0; i < 2; i++) WG.spawn('mist', p[0] + (Math.random() - 0.5) * 0.3, p[1] + Math.random() * 0.3, p[2] + (Math.random() - 0.5) * 0.3, { life: 5 + Math.random() * 4, size: 0.25 + Math.random() * 0.3 });
        }
        break;
      }
      case 'wipe': {
        WG.state.mist = Math.max(0, WG.state.mist - 0.012);
        WG.state.wipedAt = WG.time;
        WG.audio && WG.audio.event('wipe');
        break;
      }
      case 'feed': {
        drag.cl.water = M.sat(drag.cl.water + 0.01);
        drag.cl.alpha = Math.min(1, drag.cl.alpha + 0.05);
        break;
      }
    }
  }

  function hover(e) {
    const r = ray(e.clientX, e.clientY);
    const cl = hitCloud(r);
    WG.clouds.hovered = cl;
    const s = sunHit(r);
    let cur = 'grab';
    if (s) cur = 'grab';
    else if (cl) cur = 'grab';
    else if (treeHit(r)) cur = 'grab';
    else if (WG.tool === 'wipe') cur = 'none';
    cv().style.cursor = WG.tool === 'hand' ? cur : (WG.tool === 'wipe' ? 'none' : 'crosshair');
  }

  function onUp(e) {
    if (!drag) return;
    if (drag.mode === 'cloud') {
      const fling = (WG.time - downT) < 0.3;
      WG.clouds.release();
    }
    if (drag.mode === 'tree') {
      const tr = drag.tr;
      tr.pull = tr.pull || [0, 0];
      tr.wob = [tr.pull[0] * 0.35, tr.pull[1] * 0.35];
      tr.pull = null;
    }
    drag = null;
  }

  function onWheel(e) {
    if (e.target !== cv()) return;
    e.preventDefault();
    const r = ray(e.clientX, e.clientY);
    const cl = hitCloud(r);
    if (cl && WG.tool === 'hand') {
      cl.water = M.sat(cl.water + 0.02);
      cl.tx = cl.x; cl.tz = cl.z; cl.ty = cl.y;
      cl.hold = 0.4; cl.sqT = Math.min(1, cl.sqT + 0.22);
      WG.events.emit('tut:squeeze');
      return;
    }
    WG.cam.zoom(Math.exp(e.deltaY * 0.0012));
  }

  I.init = function () {
    const c = cv();
    c.addEventListener('pointerdown', onDown);
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
    c.addEventListener('wheel', onWheel, { passive: false });
    c.addEventListener('contextmenu', e => e.preventDefault());
    // touch pinch
    let pts = new Map(), pinchD = 0;
    c.addEventListener('touchstart', ev => { for (const t of ev.changedTouches) pts.set(t.identifier, t); }, { passive: true });
    c.addEventListener('touchmove', ev => {
      for (const t of ev.changedTouches) pts.set(t.identifier, t);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (pinchD) WG.cam.zoom(pinchD / d);
        pinchD = d;
      }
    }, { passive: true });
    c.addEventListener('touchend', ev => { for (const t of ev.changedTouches) pts.delete(t.identifier); if (pts.size < 2) pinchD = 0; }, { passive: true });
    addEventListener('keydown', e => {
      if (e.target && /input|textarea/.test(e.target.tagName)) return;
      const k = e.key.toLowerCase();
      const map = { '1': 'hand', 'h': 'hand', '2': 'wind', 'w': 'wind', '3': 'cloud', 'c': 'cloud', '4': 'fog', 'f': 'fog', '5': 'wipe', 'g': 'wipe' };
      if (map[k]) { WG.actions.setTool(map[k]); if (map[k] === 'wind') WG.events.emit('tut:wind'); WG.audio && WG.audio.event('uiTick'); }
      if (k === 'u') { WG.actions.toggleControls(); }
      if (k === 'escape') WG.actions.toggleControls(false);
    });
    // sun hover hint
    setInterval(() => {
      try {
        const s = [WG.sky.sunDir[0] * 13, 3.6 + WG.sky.sunDir[1] * 13, WG.sky.sunDir[2] * 13];
        const p = M.xformPoint(WG.cam.viewProj, s);
        I.sunScreen = [(p[0] * 0.5 + 0.5) * innerWidth, (-p[1] * 0.5 + 0.5) * innerHeight];
      } catch (err) { WG.err(err); }
    }, 500);
  };
})();

/* ===== 90_audio.js ===== */
/* 90_audio.js — Weatherglass sound. Everything synthesised with WebAudio. audio-dev owns this file.
   Nothing here may throw. The graph is built by init() but ready stays false until a gesture
   (unless the platform already permits audio). One-shot voices are pooled to 12, ambience is 12 nodes. */
(function () {
  'use strict';
  if (typeof WG === 'undefined' || !WG) return;

  var MASTER = 0.6, POOL_MAX = 12, PAN_SCALE = 0.12;

  var api = { ready: false, muted: false };
  api.init = init; api.setMuted = setMuted; api.update = update; api.event = event;
  api.get = get; api.set = set; api.level = level; api.selftest = selftest;

  var ctx = null, initState = 0, dead = false, gestureSeen = false;
  var pink = null, white = null, brown = null, lvBuf = null;
  var dry = null, wetIn = null, wetOut = null, conv = null, comp = null, dampNode = null, master = null, analyser = null;
  var pool = [], amb = {}, sq = null, timers = [];
  var lastFire = {}, lastUpd = 0, lastResume = 0, lastLightning = 0, lastBirdAt = 0;
  var windSm = 0, rainSm = 0, snowSm = 0, frozenSm = 0, leafSm = 0;
  var explicitRain = 0;
  var birdAcc = 0, dropAcc = 0, cricketAcc = 0, frogAcc = 0, owlAcc = 0, gurgleAcc = 0, flashSeen = 0;
  var dropVoices = 0, ampEst = 0, lvVal = 0, lvAt = 0;
  var DEDUP = { uiTick: 14, wipe: 75, windStroke: 55, squeeze: 30, splash: 35, drip: 40, detent: 24, gaugeTap: 40 };
  var MOTIFS = null;

  function err(e) { try { WG.err(e); } catch (x) {} }
  function noop() {}
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- init / lifecycle ---------- */

  function init() {

  }

  function build() {

    lastLightning = 0; lastBirdAt = 0; explicitRain = 0;

  function setMuted(b) {
    var m = !!b;

      master.gain.cancelScheduledValues(t);

  /* ---------- per-frame ---------- */

        try { if (ctx.resume) ctx.resume().catch(noop); } catch (e) {}
      }
      if (api.muted) return;

      var st = WG.state || {};
      var wind = clamp(num(st.wind, 0), 0, 1);
      var temp = num(st.temperature, 15);
      var hum = clamp(num(st.humidity, 0.4), 0, 1);
      var cover = clamp(num(st.cloudCover, 0), 0, 1);
      var wet = clamp(num(st.wetness, 0), 0, 1);
      var snow = clamp(num(st.snow, 0), 0, 1);
      var fog = clamp(num(st.fog, 0), 0, 1);
      var frozen = clamp(num(st.frozen, 0), 0, 1);
      var flash = clamp(num(st.flash, 0), 0, 1);
      var season = ((num(st.season, 0) % 1) + 1) % 1;

      try {

        if (WG.f && WG.f.daylight) day = clamp(num(WG.f.daylight(), day), 0, 1);
      } catch (e) {}

      explicitRain = Math.max(0, explicitRain - dt * 0.45);
      var weather = String(st.weather || '');
      var wBoost = /downpour|storm|rain|shower|drizzle|thunder|sleet/i.test(weather) ? 0.35 : 0;

      sm(amb.gust.frequency, 0.05 + windSm * 0.42, now, 1.4);
      sm(amb.gustDepth.gain, 0.0015 + windSm * windSm * 0.045, now, 1.1);
      sm(amb.wind.nodes[2].frequency, 460 + windSm * 1500, now, 0.7);
      var leafA = leafSm * (0.0035 + windSm * 0.05);
      sm(amb.leaves.gain.gain, leafA * 0.6, now, 0.45);
      sm(amb.leafDepth.gain, leafA * 0.75, now, 0.45);
      sm(amb.leafOsc.frequency, 4.2 + windSm * 5.8, now, 0.6);
      sm(amb.howl.gain.gain, storm * 0.055, now, 0.7);
      sm(amb.howl.nodes[1].frequency, 420 + windSm * 780, now, 0.8);
      sm(amb.rain.gain.gain, rainSm * 0.048, now, 0.45);
      sm(amb.roar.gain.gain, rainSm * rainSm * 0.11, now, 0.65);
      sm(amb.snow.gain.gain, snowSm * 0.013, now, 0.75);
      var wf = (1 - frozenSm) * (0.03 + rainSm * 0.032);
      sm(amb.fall.gain.gain, wf, now, 0.55);
      sm(amb.river.gain.gain, Math.max(0, wf * 0.58), now, 0.55);
      sm(amb.fall.pan.pan, panFor(amb.fall.x, amb.fall.z), now, 0.5);
      sm(amb.river.pan.pan, panFor(amb.river.x, amb.river.z), now, 0.5);
      sm(amb.wind.pan.pan, panFor(amb.wind.x, amb.wind.z), now, 0.7);
      sm(amb.leaves.pan.pan, panFor(amb.leaves.x, amb.leaves.z), now, 0.7);
      sm(dampNode.frequency, clamp(15000 - hum * 3200 - fog * 6200, 4400, 16000), now, 1.2);

      /* flash without an explicit event */
      if (flash > 0.45 && performance.now() - lastLightning > 1400) {
        lightning(0.35 + Math.random() * 0.6);
      }
      if (flash > 0.2) flashSeen = now;

      var waterAud = wf;
      var detail = num(WG.detail, 2);

      /* birds / owl */
      if (!night) {
        var dawn = Math.exp(-Math.pow((hour - 5.7) / 1.05, 2)) + Math.exp(-Math.pow((hour - 18.7) / 1.3, 2));
        var seasonF = Math.pow(0.5 + 0.5 * Math.cos(season * Math.PI * 2), 0.7);
        var rate = (0.02 + day * 0.2 + dawn * 0.72) * (0.4 + seasonF * 0.75);

        if (windSm > 0.78) rate *= 0.3;

      } else {

        if (owlAcc > 2) owlAcc = 2;
        if (owlAcc >= 1) { owlAcc -= 1; owl(now); }
      }

      /* crickets */
      var cricketOn = night && temp > 10 && hum < 0.9 && !(season > 0.62 && season < 0.88) && rainSm < 0.55;
      if (cricketOn) {
        var cr = 0.12 + (temp - 10) * 0.075;
        cricketAcc += dt * Math.min(2.2, cr);
        if (cricketAcc > 2) cricketAcc = 2;
        if (cricketAcc >= 1 && detail > 1) { cricketAcc -= 1; cricket(now); }
      }

      /* frogs, mild spring nights */
      var springNight = night && (season < 0.14 || season > 0.9) && temp > 6 && temp < 21 && rainSm < 0.7;
      if (springNight) {
        frogAcc += dt * 0.12;
        if (frogAcc > 1.5) frogAcc = 1.5;
        if (frogAcc >= 1) { frogAcc -= 1; frog(now); }
      }

      /* rain drops */
      dropAcc += dt * (0.3 + rainSm * rainSm * 25);
      if (dropAcc > 4) dropAcc = 4;
      while (dropAcc >= 1 && dropVoices < (detail > 1 ? 4 : 3)) { dropAcc -= 1; rainDrop(now); }

      /* water gurgles */
      if (waterAud > 0.012) {
        gurgleAcc += dt * (0.35 + rainSm * 1.4);
        if (gurgleAcc > 2) gurgleAcc = 2;
        if (gurgleAcc >= 1) { gurgleAcc -= 1; gurgle(now); }
      }

      /* level estimate fallback */
      var sum = 0;
      for (var i = 0; i < pool.length; i++) if (pool[i].active) { try { sum += pool[i].gain.gain.value; } catch (e) {} }
      sum += rainSm * 0.05 + windSm * 0.05 + wf * 0.06 + 0.004;
      ampEst = sum * (master ? master.gain.value : MASTER);
    } catch (e) { err(e); }
  }

  /* ---------- event voices ---------- */

  function grab(d) {
    var size = clamp(num(d && d.size, 0.4), 0, 1);
    var pan = panForX(d && d.x);
    noiseShot('grab', pan, { dur: 0.26 + size * 0.2, peak: 0.09, from: 1600 - size * 1050, to: 420, type: 'lowpass', q: 0.8, attack: 0.018, send: 0.3 });

  }

  function squeezeStart(d) {
    if (!ctx || !api.ready) return;
    var now = ctx.currentTime, pan = panForX(d && d.x);
    if (sq && sq.active) {
      sq.endsAt = now + 0.5;
      try {
        sq.extra.bp.frequency.setTargetAtTime(650 + Math.random() * 800, now, 0.05);
        sm(sq.pan.pan, pan, now, 0.08);
      } catch (e) {}
      return;
    }
    var v = take('squeeze', pan, now);
    if (!v) return;
    var osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 76 + Math.random() * 16;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 3;
    var lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.5;
    var lfoG = ctx.createGain(); lfoG.gain.value = 190;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    var ns = loopSrc(white, 0.9);
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 5;
    var ng = ctx.createGain(); ng.gain.value = 0.4;
    osc.connect(lp); lp.connect(v.gain); ns.connect(bp); bp.connect(ng); ng.connect(v.gain);
    v.gain.gain.setValueAtTime(0.0001, now);
    v.gain.gain.exponentialRampToValueAtTime(0.07, now + 0.06);
    v.send.gain.setValueAtTime(0.22, now);
    osc.start(now); lfo.start(now);
    v.nodes = [osc, lp, lfo, lfoG, ns, bp, ng];
    v.loop = true; v.endsAt = now + 0.6; v.extra = { bp: bp, lp: lp };
    sq = v;
  }

  function squeezeStop(now) {
    var v = sq; sq = null;
    if (!v || !v.active) return;
    var t = now == null ? ctx.currentTime : now;
    try {
      v.gain.gain.cancelScheduledValues(t);
      v.gain.gain.setTargetAtTime(0.0001, t, 0.07);

  /* ---------- creatures ---------- */

  function noteList(f, dur, gap, peak, bend, type) { return { f: f, dur: dur, gap: gap, peak: peak, bend: bend, type: type }; }

  function motifCuckoo(b) { return [noteList(b * 0.62, 0.17, 0.1, 0.045, 0.98, 'triangle'), noteList(b * 0.5, 0.22, 0.12, 0.04, 0.97, 'triangle')]; }
  function motifCoo(b) { return [noteList(b * 0.22, 0.3, 0.16, 0.032, 0.94, 'triangle'), noteList(b * 0.18, 0.36, 0.1, 0.026, 0.9, 'triangle')]; }
  function motifTrill(b) {
    var a = [];

    if (s < 0.16 && r < 0.17) return motifCuckoo;
    if (r < 0.3) return motifCoo;
    if (r < 0.48) return motifTrill;
    if (r < 0.72) return motifWarble;
    if (r < 0.87) return motifChirps;

  }

        v.gain.gain.exponentialRampToValueAtTime(n.peak, tt + 0.007);
        v.gain.gain.exponentialRampToValueAtTime(0.0002, tt + n.dur);
        osc.start(tt); osc.stop(tt + n.dur + 0.04);
        tt += n.dur + n.gap;

      v.nodes = nodes;
      v.endsAt = tt + 0.25;

  /* ---------- dispatch ---------- */

  function event(name, data) {
    try {
      if (!name) return;
      if (name === 'rainLevel') { explicitRain = clamp(num(data && data.v, 0), 0, 1); return; }
      if (name === 'soundMuted') { setMuted(!!data); return; }
      if (!ctx) init();
      if (!api.ready || dead) return;
      var d = data || {};
      var key = name + (d.pane != null ? ':' + d.pane : '');
      var nowMs = performance.now();
      var gap = DEDUP[name] == null ? 20 : DEDUP[name];
      if (nowMs - (lastFire[key] || 0) < gap) return;
      lastFire[key] = nowMs;
      if (api.muted) return;
      switch (name) {
        case 'grab': grab(d); break;
        case 'squeeze': squeezeStart(d); break;
        case 'release': release(d); break;
        case 'merge': merge(d); break;
        case 'pop': pop(d); break;
        case 'lightning': case 'flash':
          if (performance.now() - lastLightning > 900) lightning(num(d.dist, 0.4));
          break;
        case 'splash': splash(d); break;
        case 'drip': drip(d); break;
        case 'wipe': wipe(d); break;
        case 'windStroke': windStroke(d); break;
        case 'treeShake': treeShake(d); break;
        case 'uiTick': uiTick(); break;
        case 'uiToggle': uiToggle(); break;
        case 'detent': detent(); break;
        case 'chime': chime(); break;
        case 'ring': case 'glassTink': ring(d); break;
        case 'iceCrack': iceCrack(d); break;
        case 'gaugeTap': gaugeTap(d); break;
        case 'firstSunTouch': case 'firstMoonTouch': chime(); break;
        default: break;
      }
    } catch (e) { err(e); }
  }

  function subscribe() {
    if (!WG.events || !WG.events.on) return;
    var names = ['grab', 'squeeze', 'release', 'merge', 'pop', 'lightning', 'splash', 'drip', 'wipe',
      'windStroke', 'treeShake', 'uiTick', 'uiToggle', 'detent', 'chime', 'ring', 'glassTink', 'iceCrack',
      'gaugeTap', 'rainLevel', 'soundMuted', 'firstSunTouch', 'firstMoonTouch'];
    for (var i = 0; i < names.length; i++) {
      (function (n) {
        try { WG.events.on(n, function (d) { event(n, d); }); } catch (e) {}
      })(names[i]);
    }
  }

  /* ---------- introspection ---------- */

  function get(k) {
    try {
      if (k === undefined || k === null) return level();
      if (typeof k === 'number') return panForX(k);
      if (typeof k === 'object') return panFor(num(k.x, 0), num(k.z, 0));
      switch (k) {
        case 'rain': return rainSm;
        case 'wind': return windSm;
        case 'snow': return snowSm;
        case 'frozen': return frozenSm;
        case 'leaves': return leafSm;
        case 'water': return 1 - frozenSm;
        case 'level': return level();
        case 'voices': return voiceCount();
        case 'kinds': var ks = []; for (var i = 0; i < pool.length; i++) if (pool[i].active) ks.push(pool[i].kind + ':' + Math.max(0, pool[i].endsAt - (ctx ? ctx.currentTime : 0)).toFixed(2)); return ks.join(',');
        case 'master': return master ? master.gain.value : 0;
        default: return 0;
      }
    } catch (e) { return 0; }
  }

  function set(k, v) {
    try {
      if (k === 'rain') explicitRain = clamp(num(v, 0), 0, 1);
      else if (k === 'muted') setMuted(v);
    } catch (e) {}
  }

  function level() {
    var t = performance.now();
    if (t - lvAt < 180) return lvVal;
    lvAt = t; lvVal = 0;
    try {
      if (analyser && lvBuf && ctx && api.ready && ctx.state === 'running') {
        analyser.getFloatTimeDomainData(lvBuf);
        var s = 0;
        for (var i = 0; i < lvBuf.length; i++) s += lvBuf[i] * lvBuf[i];
        lvVal = Math.sqrt(s / lvBuf.length);
      } else {
        lvVal = ampEst;
      }
    } catch (e) { lvVal = ampEst; }
    return lvVal;
  }

  var specVal = 0, specAt = 0;
  function spectrum() {
    var t = performance.now();
    if (t - specAt < 240) return specVal;
    specAt = t; specVal = 0;
    try {
      if (!analyser || !ctx || !api.ready) return 0;
      var bins = new Float32Array(analyser.frequencyBinCount);
      analyser.getFloatFrequencyData(bins);
      var num = 0, den = 0, nyq = ctx.sampleRate / 2;
      for (var i = 1; i < bins.length; i++) {
        var mag = Math.pow(10, bins[i] / 20);
        num += (i * nyq / bins.length) * mag; den += mag;
      }
      specVal = den > 0.000001 ? num / den : 0;
    } catch (e) { specVal = 0; }
    return specVal;
  }
  api.spectrum = spectrum;

  function selftest() {
    try {
      if (!ctx) { gestureSeen = true; build(); }
      if (ctx) {
        api.ready = true;
        try { if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(noop); } catch (e) {}
      }
      if (!ctx || dead) return { ok: false, voices: 0 };
      update(1 / 60);
      event('uiTick');
      var ambN = 0;
      for (var k in amb) { if (amb[k] && amb[k].src) ambN++; }
      return { ok: !!(ctx && ctx.state !== 'closed'), voices: voiceCount(), ambience: ambN, state: ctx.state, level: level() };
    } catch (e) { err(e); return { ok: false, voices: 0 }; }
  }

  /* ---------- boot ---------- */

  function firstGesture() {
    try {
      gestureSeen = true;
      if (!initState) init();
      if (ctx) {
        api.ready = true;
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(noop);
      }
    } catch (e) {}
  }
  var gestures = ['pointerdown', 'keydown', 'touchstart', 'mousedown'];
  for (var gi = 0; gi < gestures.length; gi++) {
    try { addEventListener(gestures[gi], firstGesture, true); } catch (e) {}
  }

  subscribe();
  WG.audio = api;
})();

/* ===== 95_main.js ===== */
/* 95_main.js — boot, loop, resize, quality */
(function () {
  const M = WG.m, R = WG.R;
  let last = performance.now(), acc = 0, frames = 0, low = 0, qualityTimer = 0;
  let running = false;

  WG.scenarios = {
    calm: { season: 0.02, time: 15.233 },
    rain: { season: 0.24, time: 13.2 },
    storm: { season: 0.26, time: 15.83 },
    snow: { season: 0.75, time: 10.8 },
    mountainsnow: { season: 0.5, time: 10.07 },
    fog: { season: 0.5, time: 6.95 },
    autumn: { season: 0.55, time: 13.92 },
    night: { season: 0.27, time: 23.03 },
    dusk: { season: 0.27, time: 17.63 }
  };

  function presetClouds(kind) {
    const C = WG.clouds;
    if (!kind) return;
    const mk = (x, y, z, water, wet, sq) => { const c = C.spawn(x, y, z, water); c.wet = wet; c.alpha = 1; c.sq = sq || 0; c.sqT = sq || 0; return c; };
    const clear = () => { C.list.length = 0; };
    if (kind === 'storm') {
      clear();
      const a = mk(-1.4, 4.4, 0.4, 1.5, 1, 0.5);
      a.r = 2.1; a.storm = 1; a.tower = 1; a.anvil = 1; a.rain = 1; a.strikeT = 3;
      const b = mk(3.4, 5.6, -1.6, 1.1, 0.9, 0.3); b.r = 1.1; b.storm = 0.5; b.rain = 0.6; b.strikeT = 7;
      const c = mk(-4.2, 6.2, -2.2, 0.8, 0.7, 0); c.r = 0.9;
      WG.state.wind = 0.8;
    } else if (kind === 'rain') {
      clear();
      const a = mk(-1.7, 5.2, 1.2, 1.0, 1, 0.35); a.r = 1.15; a.rain = 0.85;
      const b = mk(2.8, 5.8, 0.6, 1.0, 1, 0.35); b.r = 1.05; b.rain = 0.8;
      WG.state.wetness = 0.75;
    } else if (kind === 'snow') {
      clear();
      const a = mk(-2.4, 5.6, 0.8, 1.0, 1, 0.3); a.r = 1.2; a.rain = 0.6;
      const b = mk(2.6, 6.1, -0.6, 0.9, 0.9, 0.3); b.r = 1.1; b.rain = 0.55;
    } else if (kind === 'mountainsnow') {
      clear();
      const a = mk(-2.2, 5.6, -0.8, 1.0, 0.9, 0.2); a.r = 1.1; a.rain = 0.5;
      const b = mk(1.4, 6.0, -1.6, 0.9, 0.8, 0.2); b.r = 1.0; b.rain = 0.45;
    }
  }
  function applyScenario(name) {
    const sc = WG.scenarios[name] || WG.scenarios.calm;
    const s = WG.state;
    s.time = sc.time;
    s.season = sc.season;
    s.seasonName = ['Spring', 'Summer', 'Autumn', 'Winter'][Math.round(s.season * 4) % 4];
    const baseTemp = [16, 28, 14, -3][Math.round(s.season * 4) % 4];
    s.temperature = baseTemp + (sc.time > 6 && sc.time < 18 ? 0.5 : -3);
    if (name === 'snow') { s.snow = 0.92; s.frozen = 0.8; s.wetness = 0.4; s.humidity = 0.7; }
    if (name === 'mountainsnow') { s.snow = 0.18; s.humidity = 0.6; }
    if (name === 'fog') { s.fog = 0.95; s.mist = 0.75; s.humidity = 0.9; s.wetness = 0.5; }
    if (name === 'night') { s.mist = 0.25; s.humidity = 0.55; }
    if (name === 'dusk') { s.humidity = 0.5; }
    if (name === 'storm') { s.humidity = 0.85; s.wetness = 0.8; }
    presetClouds(sc.clouds || (name === 'snow' ? 'snow' : name === 'rain' ? 'rain' : name === 'storm' ? 'storm' : name === 'mountainsnow' ? 'mountainsnow' : null));
    if (WG.clouds) for (const c of WG.clouds.list) c.alpha = 1;
  }

  function boot() {
    try {
      WG.detail = R.detect();
      R.init();
      if (WG.tex && WG.tex.build) WG.tex.build();
      R.resize();
      if (WG.world && WG.world.build) WG.world.build();
      if (WG.land && WG.land.build) WG.land.build();
      if (WG.flora && WG.flora.build) WG.flora.build();
      if (R.uploadInstances) R.uploadInstances();
      R.finalizeStatic();
      if (WG.sim && WG.sim.init) WG.sim.init();
      if (WG.clouds && WG.clouds.init) WG.clouds.init();
      if (WG.sim && WG.sim.init) WG.sim.init();
      if (WG.animals && WG.animals.init) WG.animals.init();
      if (WG.ui && WG.ui.init) WG.ui.init();
      if (WG.audio && WG.audio.init) WG.audio.init();
      if (WG.input && WG.input.init) WG.input.init();
      applyScenario(WG.scenario);
      running = true;
      requestAnimationFrame(frame);
      WG.boot();
      setTimeout(() => { if (WG.ui) WG.ui.ready = true; }, 400);
    } catch (e) {
      WG.err(e);
      console.error(e);
      const l = document.getElementById('loader');
      if (l) l.classList.add('gone');
    }
  }

  function frame(t) {
    if (!running) return;
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0.0005, (t - last) / 1000));
    last = t;
    WG.dt = dt; WG.time += dt;
    frames++; acc += dt;
    if (acc > 0.5) { WG.fps = frames / acc; frames = 0; acc = 0; }
    // adaptive resolution
    qualityTimer += dt;
    if (qualityTimer > 1.2) {
      qualityTimer = 0;
      if (WG.fps < 42 && R.quality > 0.55) { R.quality = Math.max(0.55, R.quality - 0.08); R.w = 0; R.resize(); }
      else if (WG.fps > 58 && R.quality < 1) { R.quality = Math.min(1, R.quality + 0.04); R.w = 0; R.resize(); }
    }
    try { WG.cam.update(dt); } catch (e) { WG.err(e); }
    try { WG.sky.update(dt); } catch (e) { WG.err(e); }
    try { if (WG.sim) WG.sim.update(dt); } catch (e) { WG.err(e); }
    try { if (WG.clouds) WG.clouds.update(dt); } catch (e) { WG.err(e); }
    try { if (WG.animals) WG.animals.update(dt); } catch (e) { WG.err(e); }
    try { if (WG.particles && WG.particles.update) WG.particles.update(dt); } catch (e) { WG.err(e); }
    try { if (WG.ui) WG.ui.update(dt); } catch (e) { WG.err(e); }
    try { if (WG.audio && WG.audio.ready) WG.audio.update(dt); } catch (e) { WG.err(e); }
    R.beginFrame();
    try { R.render(); } catch (e) { WG.err(e); }
    // halo screen position (case centre)
    try {
      const p = M.xformPoint(WG.cam.viewProj, [0, 3.4, 0]);
      WG.haloPos = [p[0] * 0.5 + 0.5, p[1] * 0.5 + 0.5];
    } catch (e) {}
  }

  addEventListener('resize', () => { try { R.resize(); } catch (e) {} });
  addEventListener('orientationchange', () => setTimeout(() => { try { R.resize(); } catch (e) {} }, 200));
  addEventListener('error', e => WG.err(e.error || e.message));
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
