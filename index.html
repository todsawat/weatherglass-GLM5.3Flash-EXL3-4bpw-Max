<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Weatherglass</title>
</head>
<body>
<style>
/* 80_ui.css — Weatherglass HUD. Owner: ui-dev. */

:root {
  --ink: #f4efe6;
  --ink-70: rgba(244, 239, 230, .7);
  --ink-45: rgba(244, 239, 230, .45);
  --brass: #ffd98a;
  --panel: rgba(21, 19, 17, .56);
  --edge: rgba(255, 246, 228, .13);
  --hair: rgba(255, 246, 228, .09);
  --sans: -apple-system, system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --spring: cubic-bezier(.2, 1.6, .4, 1);
  --m: 18px; --kb: 0px;
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-t: env(safe-area-inset-top, 0px);
}

html, body { margin: 0; padding: 0; height: 100%; background: #0d0c0b; overflow: hidden; }
#gl { position: fixed; inset: 0; display: block; z-index: 0; }

.sr {
  position: fixed; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ---------- loader ---------- */
.loader {
  position: fixed; inset: 0; z-index: 60;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 15px;
  background: radial-gradient(circle at 50% 46%, #1b1916 0%, #0d0c0b 78%);
  color: var(--ink);
  transition: opacity 1.5s ease;
  will-change: opacity;
}
.loader.gone { opacity: 0; pointer-events: none; }
.loader-t {
  font-family: var(--serif); font-size: 34px; font-weight: 400;
  letter-spacing: .12em; text-indent: .12em;
  color: #f4efe6;
  text-shadow: 0 2px 26px rgba(255, 217, 138, .14);
}
.loader-s {
  font-family: var(--sans); font-size: 10px; font-weight: 500;
  letter-spacing: .32em; text-transform: uppercase; text-indent: .32em;
  color: rgba(244, 239, 230, .42);
  animation: loaderPulse 3.1s ease-in-out infinite;
}
@keyframes loaderPulse { 0%, 100% { opacity: .34; } 50% { opacity: .78; } }

/* ---------- hud shell ---------- */
#hud {
  position: fixed; inset: 0; z-index: 20;
  pointer-events: none;
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
#hud *, #hud *::before, #hud *::after { box-sizing: border-box; }
#hud button {
  margin: 0; padding: 0; border: 0; background: none; color: inherit;
  font: inherit; cursor: pointer; -webkit-appearance: none; appearance: none;
  touch-action: none;
}
#hud svg { display: block; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke: currentColor; }
#hud :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 8px; }
#hud .i { pointer-events: auto; }

.hud-fade { transition: opacity .42s ease, visibility .42s; }
#hud.hidden .hud-fade { opacity: 0; visibility: hidden; pointer-events: none; }
#hud.hidden .hud-fade * { pointer-events: none; }

.panel {
  background: var(--panel);
  -webkit-backdrop-filter: blur(16px) saturate(115%);
  backdrop-filter: blur(16px) saturate(115%);
  border: 1px solid var(--edge);
  border-radius: 20px;
  box-shadow: inset 0 1px 0 var(--hair), 0 14px 34px -14px rgba(0, 0, 0, .6), 0 3px 10px rgba(0, 0, 0, .22);
}

/* ---------- wordmark ---------- */
.brand {
  position: fixed; top: calc(var(--m) + var(--sa-t)); left: calc(var(--m) + var(--sa-l));
  font-family: var(--serif); font-size: 17px; font-weight: 400;
  letter-spacing: .22em; opacity: .8; color: var(--ink);
  text-shadow: 0 1px 14px rgba(0, 0, 0, .62), 0 0 2px rgba(0, 0, 0, .5);
  white-space: nowrap; z-index: 2;
}

/* ---------- action pill ---------- */
.actions {
  position: fixed; top: calc(var(--m) + var(--sa-t)); right: calc(var(--m) + var(--sa-r));
  display: flex; align-items: center; gap: 4px; padding: 5px;
  border-radius: 999px; z-index: 4;
}
.abtn {
  position: relative; display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 50%;
  color: var(--ink); opacity: .82;
  transition: transform .26s var(--spring), opacity .2s, background .2s, color .2s;
}
.abtn svg { width: 17px; height: 17px; }
#hud .abtn:hover { transform: translateY(-1px); opacity: 1; background: rgba(255, 246, 228, .09); }
.abtn:active { transform: scale(.9); }
#hud .abtn.on { color: var(--brass); opacity: 1; filter: drop-shadow(0 0 7px rgba(255, 217, 138, .45)); }
.abtn .pulse {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid var(--brass); opacity: 0; pointer-events: none;
}
.abtn .pulse.go { animation: ringPulse .58s ease-out; }
@keyframes ringPulse {
  0% { opacity: .85; transform: scale(.72); }
  100% { opacity: 0; transform: scale(1.85); }
}
.alabel {
  position: absolute; top: calc(100% + 9px); right: 0;
  padding: 4px 8px; border-radius: 8px; white-space: nowrap;
  background: rgba(14, 13, 11, .74);
  border: 1px solid rgba(255, 246, 228, .1);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 10.5px; color: var(--ink-70);
  opacity: 0; transform: translateY(-3px); pointer-events: none;
  transition: opacity .18s ease .0s, transform .22s var(--spring) 0s;
}
.abtn:hover .alabel, .abtn:focus-visible .alabel, .abtn.tt-show .alabel { opacity: 1; transform: none; transition-delay: .45s; }

/* lone eye while hidden */
.eye {
  position: fixed; top: calc(var(--m) + var(--sa-t)); right: calc(var(--m) + var(--sa-r));
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; z-index: 5;
  color: var(--ink); opacity: 0; visibility: hidden;
  background: rgba(21, 19, 17, .34);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 246, 228, .1);
  transition: opacity .4s ease, visibility .4s, transform .3s var(--spring), background .2s;
}
.eye svg { width: 17px; height: 17px; }
#hud.hidden .eye { opacity: .62; visibility: visible; background: rgba(21,19,17,.5); }
#hud.hidden .eye:hover { opacity: .95; background: rgba(255, 246, 228, .1); }
.eye:active { transform: scale(.9); }

/* ---------- bottom rail ---------- */
.centre-col {
  position: fixed; left: 50%; bottom: calc(var(--m) + var(--sa-b) + var(--kb)); z-index: 4;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  pointer-events: none;
}
.bar-row { display: flex; align-items: flex-end; gap: 9px; pointer-events: none; }
.bar-row > * { pointer-events: auto; }

/* ---------- toolbar ---------- */
.toolbar {
  position: relative; display: flex; gap: 5px; padding: 8px;
  border-radius: 24px; -webkit-backdrop-filter: blur(16px) saturate(115%); backdrop-filter: blur(16px) saturate(115%);
  background: var(--panel);
  border: 1px solid var(--edge);
  box-shadow: inset 0 1px 0 var(--hair), 0 14px 34px -14px rgba(0, 0, 0, .62), 0 3px 10px rgba(0, 0, 0, .22);
}
.marker {
  position: absolute; left: 0; top: 0; width: 46px; height: 46px;
  border-radius: 15px; pointer-events: none;
  background: rgba(255, 217, 138, .15);
  box-shadow: inset 0 0 0 1px rgba(255, 217, 138, .2), 0 0 16px -2px rgba(255, 217, 138, .3);
  transform: translate3d(0, 0, 0);
  transition: transform .38s var(--spring), width .34s var(--spring), height .34s var(--spring);
}
.marker.squash { animation: markerSquash .34s var(--spring); }
@keyframes markerSquash {
  0% { transform: translate3d(var(--mx), var(--my), 0) scaleX(1.18) scaleY(.84); }
  60% { transform: translate3d(var(--mx), var(--my), 0) scaleX(.96) scaleY(1.04); }
  100% { transform: translate3d(var(--mx), var(--my), 0) scale(1); }
}
.tool {
  position: relative; display: grid; place-items: center;
  width: 46px; height: 46px; border-radius: 15px; color: var(--ink);
  opacity: .7; z-index: 1;
  transition: opacity .22s ease, color .22s, transform .24s var(--spring), filter .22s;
}
.tool svg { width: 22px; height: 22px; }
.tool:hover { opacity: .95; }
.tool:active { transform: scale(.93); }
#hud .tool.on {
  opacity: 1; color: var(--brass);
  filter: drop-shadow(0 0 5px rgba(255, 217, 138, .38));
  animation: toolPop .4s var(--spring);
}
@keyframes toolPop { 0% { transform: scale(.9); } 60% { transform: scale(1.09); } 100% { transform: scale(1); } }
.tool .pulse-ring { position: absolute; inset: 1px; border-radius: 15px; border: 1px solid var(--brass); opacity: 0; pointer-events: none; }
.tool.ping .pulse-ring { animation: toolPing 1.7s ease-in-out infinite; }
@keyframes toolPing { 0%, 100% { opacity: .1; transform: scale(1); } 50% { opacity: .85; transform: scale(1.09); } }

.keycap {
  display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 4.5px; border: 1px solid rgba(255, 246, 228, .2);
  background: rgba(255, 246, 228, .07);
  font-family: var(--sans); font-size: 9.5px; font-weight: 600; line-height: 1;
  color: var(--ink-70);
}

/* tooltip */
.tt {
  position: absolute; bottom: calc(100% + 11px); left: 50%;
  transform: translate(-50%, 5px); width: max-content; max-width: 228px;
  padding: 9px 11px; border-radius: 13px; text-align: left;
  background: rgba(15, 14, 12, .82);
  border: 1px solid rgba(255, 246, 228, .11);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 12px 26px -12px rgba(0, 0, 0, .7);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .28s var(--spring);
  z-index: 6;
}
.tt-row { display: flex; align-items: center; gap: 7px; }
.tt-name { font-family: var(--serif); font-size: 13px; color: var(--brass); letter-spacing: .02em; }
.tt-line { margin-top: 3px; font-size: 10.5px; line-height: 1.35; color: var(--ink-70); font-weight: 500; }
#hud.tut-on .tt { bottom: calc(100% + 58px); }
.tool:hover .tt, .tool:focus-visible .tt, .tool.tt-show .tt { opacity: 1; transform: translate(-50%, 0); transition-delay: .45s; }
#hud.touch .tt { display: none; }

/* drawer button (small screens) */
.drawer-btn {
  display: none; place-items: center; width: 44px; height: 44px; border-radius: 15px;
  color: var(--ink); opacity: .8;
  background: var(--panel);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border: 1px solid var(--edge);
  box-shadow: inset 0 1px 0 var(--hair), 0 12px 26px -14px rgba(0, 0, 0, .6);
  transition: transform .26s var(--spring), opacity .2s, color .2s;
}
.drawer-btn svg { width: 21px; height: 21px; }
.drawer-btn:active { transform: scale(.93); }
#hud .drawer-btn[aria-expanded="true"] { color: var(--brass); opacity: 1; }

/* ---------- edge panels ---------- */
/* desktop: the drawer is a transparent pass-through layer holding the two edge panels */
.drawer { position: fixed; inset: 0; z-index: 3; pointer-events: none; transition: opacity .42s ease, visibility .42s; }
#hud.hidden .drawer { opacity: 0; visibility: hidden; }
.edge { position: fixed; bottom: calc(var(--m) + var(--sa-b) + var(--kb)); pointer-events: auto; }
.time-panel { left: calc(var(--m) + var(--sa-l)); width: 184px; height: 80px; padding: 10px 12px; }
.climate { right: calc(var(--m) + var(--sa-r)); width: 136px; padding: 12px 12px 13px; display: flex; flex-direction: column; align-items: center; }
.cx-col { display: flex; flex-direction: column; align-items: center; max-width: 100%; }

.tp-top { display: flex; align-items: center; gap: 9px; }
.play {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  color: var(--ink-70); flex: 0 0 auto;
  box-shadow: inset 0 0 0 1px rgba(255, 246, 228, .18);
  transition: color .2s, box-shadow .2s, transform .26s var(--spring), background .2s;
}
.play svg { width: 11px; height: 11px; }
#hud .play:hover { color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255, 246, 228, .36); }
.play:active { transform: scale(.88); }
#hud .play[aria-pressed="true"] { color: var(--brass); box-shadow: inset 0 0 0 1px rgba(255, 217, 138, .55), 0 0 14px -2px rgba(255, 217, 138, .55); }
#hud .play[aria-pressed="true"] svg { filter: drop-shadow(0 0 6px rgba(255, 217, 138, .6)); }
.clock {
  font-family: var(--serif); font-size: 21px; line-height: 1; letter-spacing: .02em;
  color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
}

.curve { position: relative; margin-top: 4px; height: 32px; border-radius: 7px; cursor: ew-resize; touch-action: none; }
.curve svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.curve:focus-visible { outline-offset: 4px; }
.sky-day { stroke: var(--brass); stroke-width: 1.5; stroke-linecap: round; fill: none; }
.sky-fill { fill: url(#wgWarm); stroke: none; }
.sky-night { stroke: rgba(168, 200, 226, .55); stroke-width: 1.2; stroke-dasharray: 2 2.4; fill: none; }
.hor { stroke: rgba(255, 246, 228, .16); stroke-width: 1; stroke-dasharray: 1 3; }
.tick { stroke: rgba(255, 246, 228, .3); stroke-width: 1; }
.orb {
  position: absolute; left: 0; top: 0; width: 17px; height: 17px;
  margin: -8.5px 0 0 -8.5px; pointer-events: none;
  transition: opacity .5s ease;
}
.orb svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .5s ease; }
.orb-sun { color: var(--brass); filter: drop-shadow(0 0 5px rgba(255, 199, 106, .75)); }
.orb-moon { color: #d8e5ef; filter: drop-shadow(0 0 4px rgba(200, 224, 244, .4)); }

/* climate */
.temp { font-family: var(--serif); font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.wx {
  margin-top: 1px; font-size: 10.5px; color: var(--ink-70); text-align: center;
  max-width: 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dial {
  position: relative; width: 92px; height: 92px; margin-top: 8px; border-radius: 50%;
  touch-action: none; cursor: grab; flex: 0 0 auto;
}
.dial:active { cursor: grabbing; }
.dial:focus-visible { outline-offset: 3px; }
.dial-dish { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 46%, rgba(255, 246, 228, .045), rgba(0, 0, 0, .28) 76%); box-shadow: inset 0 1px 1px rgba(255, 246, 228, .12), inset 0 -6px 14px rgba(0, 0, 0, .3); }
.dial-ring {
  position: absolute; inset: 5px; border-radius: 50%;
  background: conic-gradient(from 0deg, #e6a0c1 0deg, #cfb27e 45deg, #7fc07a 90deg, #c9b073 135deg, #e2923f 180deg, #c79a8d 225deg, #9dc4dd 270deg, #c2a2c6 315deg, #e6a0c1 360deg);
  opacity: .85;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.8px), #000 calc(100% - 2.4px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.8px), #000 calc(100% - 2.4px));
}
.dial-ticks { position: absolute; inset: 0; width: 100%; height: 100%; color: rgba(255, 246, 228, .22); }
.dial-ticks svg { width: 100%; height: 100%; }
.dial-ticks line { stroke: currentColor; stroke-width: 1; }
.sym {
  position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
  color: var(--ink); opacity: .5; pointer-events: auto;
  transition: transform .3s var(--spring), opacity .25s, color .25s, filter .25s;
}
.sym svg { width: 100%; height: 100%; stroke-width: 1.4; }
.sym.near { opacity: .95; transform: scale(1.28); }
#hud .sym.near[data-s="0"] { color: #f0b3cc; }
#hud .sym.near[data-s="1"] { color: #cfe58f; }
#hud .sym.near[data-s="2"] { color: #f0a863; }
#hud .sym.near[data-s="3"] { color: #c6e3f4; }
#hud .sym.on { filter: drop-shadow(0 0 6px currentColor); }
.sym:active { transform: scale(1.1); }
.knob {
  position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
  border-radius: 50%; background: var(--brass);
  box-shadow: 0 0 7px rgba(255, 217, 138, .7);
  pointer-events: none;
}
.dial-face {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  text-align: center; border: 0; background: none; cursor: pointer;
  transition: box-shadow .3s, transform .3s var(--spring);
}
.dial-face::before {
  content: ""; position: absolute; inset: 4px; border-radius: 50%;
  background: radial-gradient(circle, var(--glow, rgba(230, 160, 193, .34)), transparent 72%);
  filter: blur(2px); opacity: .9; pointer-events: none;
}
.dial-face:active { transform: translate(-50%, -50%) scale(.94); }
.sname {
  position: relative; font-family: var(--serif); font-size: 10px; line-height: 1.05;
  letter-spacing: .01em; color: var(--ink); text-shadow: 0 1px 6px rgba(0, 0, 0, .5);
}
.dial.ping { animation: dialPing 1.9s ease-in-out infinite; }
@keyframes dialPing {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 217, 138, .0); }
  50% { box-shadow: 0 0 0 4px rgba(255, 217, 138, .22); }
}

/* ---------- hints ---------- */
.hints {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--m) + 128px + var(--sa-b) + var(--kb));
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; width: max-content; max-width: min(430px, calc(100vw - 32px));
}
.tut-slot {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; width: max-content; max-width: min(430px, calc(100vw - 32px));
}
.hints > *, .tut-slot > * { pointer-events: auto; }
.hint {
  display: block; padding: 7px 13px; border-radius: 999px; white-space: normal;
  max-width: 100%; text-align: center;
  background: rgba(16, 15, 13, .8); border: 1px solid rgba(255, 246, 228, .12);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  color: var(--ink); font-size: 11px;
  box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .8);
  animation: hintIn .5s var(--spring) both;
  transition: opacity .55s ease, transform .55s ease;
}
.hint.out { opacity: 0; transform: translateY(-4px); }
@keyframes hintIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---------- tutorial ---------- */
.tut {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 9px 8px 8px; border-radius: 999px;
  background: rgba(16, 15, 13, .84); border: 1px solid rgba(255, 246, 228, .14);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .8);
  animation: hintIn .5s var(--spring) both;
  transition: opacity .4s ease, transform .4s ease;
}
.tut.out { opacity: 0; transform: translateY(8px) scale(.97); }
.tut-ico {
  flex: 0 0 auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  color: var(--brass);
  background: rgba(255, 217, 138, .14);
  box-shadow: inset 0 0 0 1px rgba(255, 217, 138, .3);
}
.tut-ico svg { width: 16px; height: 16px; }
.tut-ico.done { background: rgba(255, 217, 138, .9); color: #221c12; box-shadow: 0 0 18px -2px rgba(255, 217, 138, .8); }
.tut-ico.done svg { stroke-width: 2.2; }
.tut-body { display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
.tut-txt { font-family: var(--serif); font-size: 13px; line-height: 1.2; white-space: nowrap; color: var(--ink); }
.dots { display: flex; gap: 4px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 246, 228, .24); transition: background .3s, transform .3s var(--spring); }
.dot.done { background: rgba(255, 217, 138, .55); }
.dot.cur { background: var(--brass); transform: scale(1.35); }
.tut-btns { display: flex; gap: 4px; margin-left: 2px; }
.rbtn {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  color: var(--ink-70); box-shadow: inset 0 0 0 1px rgba(255, 246, 228, .16);
  transition: color .2s, box-shadow .2s, transform .24s var(--spring);
}
.rbtn svg { width: 12px; height: 12px; }
#hud .rbtn:hover { color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255, 246, 228, .34); }
.rbtn:active { transform: scale(.88); }
#hud .rbtn.next { color: var(--brass); box-shadow: inset 0 0 0 1px rgba(255, 217, 138, .4); }

/* ---------- mobile drawer ---------- */
@media (max-width: 860px) {
  .time-panel { width: 166px; }
  .climate { width: 124px; }
  .toolbar { gap: 4px; padding: 7px; }
  .tool, .marker { width: 42px; height: 42px; }
  .tool svg { width: 20px; height: 20px; }
}

@media (max-width: 720px) {
  :root { --m: 12px; }
  #hud { font-size: 12px; }
  .brand { font-size: 14px; letter-spacing: .2em; opacity: .72; }
  .edge { position: static; width: auto; height: auto; }
  .drawer {

    const blocks = [];
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORM_BLOCKS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniformBlockName(p, i);
      gl.uniformBlockBinding(p, gl.getUniformBlockIndex(p, name), i);
      blocks.push(name);
    }
    return { p, u, blocks };
  }

  const COMMON = `
  precision highp float;
  precision highp int;
  layout(std140) uniform Scene {
    mat4 uView; mat4 uProj; mat4 uViewProj; mat4 uLightViewProj;
    vec4 uCamPos; vec4 uSunDir; vec4 uSunColor; vec4 uSky;
    vec4 uGround; vec4 uTime; vec4 uMisc;
    vec4 uFog; vec4 uWin; vec4 uRes;
    vec4 uSeason; vec4 uWeather; vec4 uMist; vec4 uFlash; vec4 uPad;
  };
  `;

  /* ---------- terrain/surface shaders ---------- */
  const VS_SURF = `#version 300 es
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNormal;
  layout(location=2) in vec2 aUV;
  layout(location=3) in vec4 aInst0; // rot/scale x + trans x
  layout(location=4) in vec4 aInst1;
  layout(location=5) in vec4 aInst2;
  layout(location=6) in vec4 aColor;
  layout(location=7) in vec4 aExtra; // billboard, sway, phase, glow
  ${COMMON}
  out vec3 vW; out vec3 vN; out vec2 vUV; out vec4 vC; out vec4 vX; out float vDist;
  uniform float uSway[64];
  uniform float uSwayAmt;
  void main(){
    vec3 pos = aPos;
    vec3 nrm = aNormal;
    mat3 rot = mat3(aInst0.xyz, aInst1.xyz, aInst2.xyz);
    vec3 wp = rot * pos + vec3(aInst0.w, aInst1.w, aInst2.w);
    vec3 wn = normalize(mat3(aInst0.xyz, aInst1.xyz, aInst2.xyz) * nrm);
    // billboard
    if (aExtra.x > 0.5) {
      vec3 t = normalize(vec3(uView[0][0], uView[1][0], uView[2][0]));
      vec3 up = vec3(0.0,1.0,0.0);
      float s = max(aExtra.z, 0.0001);
      wp = wp + t * pos.x * s + up * pos.y * s;
      wn = t * nrm.x + up * nrm.y;
      wp.y += pos.z * aExtra.w;
    }
    // sway (grass, flowers, foliage) keyed by world pos, wind direction in uWin
    float sw = aExtra.y;
    if (sw > 0.001) {
      float ph = wp.x * 1.7 + wp.z * 1.3 + uTime.x * 1.6;
      float gust = 0.55 + 0.45 * sin(uTime.x * 0.6 + wp.x * 0.35 + wp.z * 0.2);
      vec3 wd = normalize(vec3(uWin.z, 0.0, uWin.w) + vec3(0.0001));
      float bend = (uWin.x * 2.6 * gust + 0.25) * sw * uSwayAmt;
      wp += wd * bend * (0.35 + 0.65 * sin(ph) * 0.5 + 0.5) * 0.12;
      wp.y -= bend * 0.05 * sw;
      wn = normalize(wn + wd * bend * 0.35);
    }
    vW = wp; vN = wn; vUV = aUV; vC = aColor; vX = aExtra;
    vec4 vp = uViewProj * vec4(wp, 1.0);
    vDist = length(uCamPos.xyz - wp);
    gl_Position = vp;
  }`;

  const FS_SURF = `#version 300 es
  ${COMMON}
  in vec3 vW; in vec3 vN; in vec2 vUV; in vec4 vC; in vec4 vX; in float vDist;
  uniform int uMat;
  uniform sampler2D uShadow;
  uniform sampler2D uDetail; uniform float uShadowSize; uniform int uTile; uniform float uDetailAmt;
  uniform sampler2D uCloudShadow;
  uniform vec3 uFlashPos;
  uniform float uFlashAmt;
  out vec4 outColor;

  float hash(vec3 p){ p = fract(p*0.3183099+vec3(0.71,0.113,0.419)); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float vnoise(vec3 x){
    vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5;} return s; }

  float shadowAt(vec3 N){
    vec3 p = vW + N*0.095;
    vec4 lp = uLightViewProj * vec4(p, 1.0);
    vec3 c = lp.xyz*0.5+0.5;
    if (c.x<0.0||c.x>1.0||c.y<0.0||c.y>1.0||c.z>1.0) return 1.0;
    float bias = 0.0014 + 0.0032*(1.0-abs(dot(N, uSunDir.xyz)));
    float s = 0.0; vec2 ts = vec2(1.0/float(uShadowSize))*2.2;
    for(int y=-2;y<=2;y++) for(int x=-2;x<=2;x++){
      float d = texture(uShadow, c.xy + vec2(float(x),float(y))*ts).r;
      s += (c.z - bias > d) ? 0.0 : 1.0;
    }
    return s/25.0;
  }
  float cloudShade(){
    vec2 uv = (vW.xz + vec2(6.0,4.0))/vec2(12.0,8.0);
    float s = 0.0;
    for(int i=0;i<5;i++){
      float a = float(i)*1.2566;
      s += texture(uCloudShadow, uv + vec2(cos(a),sin(a))*0.012).r;
    }
    return s/5.0;
  }

  vec3 swamp(vec3 c, float wet, float gloss){
    return c;
  }

  vec3 detailTex(vec3 p, vec3 n){
    vec2 off = vec2(float(uTile & 1), float((uTile >> 1) & 1)) * 0.5;
    vec3 bw = abs(n); bw = bw*bw; bw /= (bw.x+bw.y+bw.z+0.0001);
    float sc = 0.16;
    vec3 cx = texture(uDetail, off + p.zy*sc).rgb;
    vec3 cy = texture(uDetail, off + p.xz*sc).rgb;
    vec3 cz = texture(uDetail, off + p.xy*sc).rgb;
    return cx*bw.x + cy*bw.y + cz*bw.z;
  }

  void main(){
    vec3 N = normalize(vN);
    vec3 V = normalize(uCamPos.xyz - vW);
    if (dot(N, V) < 0.0) N = -N;
    float nz = fbm(vW*7.0);
    float nz2 = fbm(vW*23.0);
    vec3 albedo = vC.rgb;
    float rough = 0.72, metal = 0.0, gloss = 0.0, transl = 0.0, spec = 0.03;
    vec3 emis = vec3(0.0);
    float wet = uWeather.x;
    float snow = uWeather.y;
    float frost = uWeather.z;
    float mat = float(uMat);

    // ---- 1 ground/soil ----
    if (uMat == 0 || uMat == 10) {
      float layers = vW.y;
      vec3 soil = mix(vec3(0.10,0.075,0.058), vec3(0.20,0.135,0.085), smoothstep(-1.7,-0.2,layers));
      float band = sin(layers*17.0 + nz*5.0);
      soil *= 0.86 + 0.24*band;
      soil = mix(soil, vec3(0.30,0.16,0.10), smoothstep(0.55,0.85, fbm(vec3(vW.x*0.9, vW.y*6.0, vW.z*0.9)+11.0))*0.7);
      // stones in gravel band
      float g = smoothstep(0.42,0.46,layers)*smoothstep(0.20,0.16,layers);
      soil = mix(soil, vec3(0.24,0.24,0.235)*(0.7+nz2*0.6), g*0.75);
      float top = smoothstep(0.62,0.72,layers);
      soil = mix(soil, vec3(0.075,0.075,0.055), top*0.85);
      soil = mix(soil, vec3(0.055,0.115,0.045), smoothstep(0.74,0.80,layers));
      if (uMat==10) soil = mix(soil, vec3(0.32,0.31,0.30), 0.28);
      albedo = soil*(0.86+0.32*nz);
      rough = 0.92;
      albedo *= 1.0 - wet*0.42; gloss = wet;
      if (frost>0.01) albedo = mix(albedo, vec3(0.82,0.86,0.9), frost*0.35);
    }
    // ---- 2 rock ----
    if (uMat == 2) {
      float strata = sin(vW.y*7.0 + fbm(vW*2.3)*3.0 + vW.x*0.3);
      vec3 rc = mix(vec3(0.285,0.28,0.268), vec3(0.415,0.405,0.385), smoothstep(-0.5,0.85,strata));
      rc *= 0.82 + 0.34*fbm(vW*5.0);
      float rust = smoothstep(0.62,0.78, fbm(vW*3.1+7.0));
      rc = mix(rc, vec3(0.365,0.275,0.20), rust*0.30);
      float cr2 = abs(fbm(vW*2.2+13.0)-0.5);
      rc *= mix(0.72, 1.0, smoothstep(0.0, 0.055, cr2));
      float lichen = smoothstep(0.70,0.86, fbm(vW*17.0)*max(0.0,N.y));
      rc = mix(rc, vec3(0.42,0.45,0.34), lichen*0.35);
      float moss = smoothstep(0.2,0.65, fbm(vW*7.0+3.0)) * smoothstep(2.4,0.4,vW.y) * smoothstep(0.1,0.7,N.y);
      rc = mix(rc, vec3(0.13,0.20,0.10), moss*0.6);
      // rain streaks
      rc *= 0.9 + 0.2*smoothstep(0.35,0.65, vnoise(vec3(vW.x*9.0, vW.y*1.4, vW.z*9.0)));
      albedo = rc; rough = 0.88;
      albedo *= 1.0 - wet*0.35; gloss = wet*0.8;
      if (snow>0.01) { float f = smoothstep(0.45,0.8,N.y)*(1.0-smoothstep(0.55,0.85, 1.0-N.y)); albedo = mix(albedo, vec3(0.92,0.94,0.97), snow*f*0.9); }
    }
    // ---- 3 brass ----
    if (uMat == 3) {
      vec3 base = vec3(0.62,0.48,0.26);
      float tarnish = smoothstep(0.3,0.9, fbm(vW*5.0));
      float low = 1.0 - smoothstep(1.4,3.2,vW.y);
      base = mix(base, vec3(0.26,0.185,0.10), tarnish*0.55 + low*0.45);
      float pat = smoothstep(0.72,0.8, fbm(vW*22.0));
      base = mix(base, vec3(0.20,0.30,0.24), pat*0.5);
      base *= 0.9+0.2*nz;
      albedo = base; metal = 1.0; rough = 0.28 + tarnish*0.22 + low*0.2; spec = 1.0;
    }
    // ---- 4 walnut / dark wood ----
    if (uMat == 4 || uMat == 12) {
      vec3 base = uMat==4 ? vec3(0.115,0.075,0.052) : vec3(0.36,0.25,0.15);
      float grain = sin((vW.y*2.0 + fbm(vec3(vW.x*2.0, vW.y*26.0, vW.z*2.0))*6.0)*22.0);
      float fig = fbm(vec3(vW.x*1.2, vW.y*40.0, vW.z*1.2));
      base *= 0.78 + 0.35*smoothstep(-0.4,0.9,grain) ;
      base = mix(base, base*1.7, smoothstep(0.55,0.85,fig)*0.7);
      base *= 0.92 + 0.16*nz2;
      float pores = smoothstep(0.86,0.95, vnoise(vec3(vW.x*70.0, vW.y*70.0, vW.z*70.0)));
      base *= 1.0 - pores*0.25;
      albedo = base; rough = 0.42; spec = 0.35; gloss = 0.4;
      if (uMat==4) { float wear = smoothstep(0.5,1.0, fbm(vW*3.0+vW.y)); albedo *= 1.0+wear*0.25; }
    }
    // ---- 5 foliage ----  vX.w = kind: 1 cherry 2 pine 3 birch 4 oak
    if (uMat == 5) {
      float seas = uSeason.x;
      float sp = 1.0 - smoothstep(0.0, 0.12, abs(mod(seas + 0.5, 1.0) - 0.5));   // springness
      float su = 1.0 - smoothstep(0.0, 0.13, abs(mod(seas + 0.25, 1.0) - 0.5));
      float au = 1.0 - smoothstep(0.0, 0.14, abs(mod(seas, 1.0) - 0.0) + step(0.5, seas)*0.0);
      au = smoothstep(0.30, 0.42, seas) * (1.0 - smoothstep(0.60, 0.72, seas));
      float wi = smoothstep(0.60, 0.74, seas) * (1.0 - smoothstep(1.0, 1.06, seas)) + step(0.86, seas)*0.0;
      wi = max(smoothstep(0.62, 0.76, seas), 1.0 - smoothstep(0.02, 0.12, seas));
      int k = int(vX.w + 0.5);
      vec3 green = vec3(0.145, 0.225, 0.085);
      vec3 c = green;
      if (k == 1) c = mix(mix(vec3(0.30,0.20,0.22), green, su*0.9), vec3(0.36,0.10,0.10), au);
      else if (k == 2) c = mix(vec3(0.055,0.105,0.062), vec3(0.075,0.135,0.075), su*0.6);
      else if (k == 3) c = mix(mix(vec3(0.22,0.28,0.10), green, 0.5), vec3(0.42,0.28,0.05), au);
      else if (k == 4) c = mix(green, vec3(0.26,0.13,0.05), au*0.8);
      c = mix(c, vC.rgb, 0.28 + 0.3*su);
      c *= 0.62 + 0.72*nz;
      // thin the crown in winter
      float h = hash(vec3(floor(vW*22.0)));
      if (k != 2 && wi > 0.05 && h < wi*0.82) discard;
      albedo = c; rough = 0.9; transl = 0.3; spec = 0.06;
      if (snow>0.02) albedo = mix(albedo, vec3(0.9,0.92,0.96), snow*smoothstep(0.05,0.9,N.y)*0.8);
    }
    // ---- 6 animal ----
    if (uMat == 6) { albedo = vC.rgb*(0.9+0.2*nz); rough = 0.7; }
    // ---- 7 ice/glassy solid ----
    if (uMat == 7) {
      albedo = mix(vec3(0.72,0.80,0.85), vec3(0.88,0.92,0.96), nz);
      rough = 0.16; spec = 0.8; transl = 0.4;
    }
    // ---- 8 painted / cloth ----
    if (uMat == 8) { albedo = vC.rgb*(0.85+0.3*nz); rough = 0.6; }
    // ---- 9 self-lit (windows, lantern, gauge glow) ----
    if (uMat == 9) { albedo = vC.rgb*0.3; emis = vC.rgb; rough = 0.4; }
    // ---- 11 water (still surfaces like poddle) ----
    if (uMat == 11) { albedo = vC.rgb; rough = 0.06; spec = 1.0; metal = 0.0; gloss = 1.0; }
    // ---- 13 snow ----
    if (uMat == 13) { albedo = vec3(0.90,0.92,0.96)*(0.9+0.2*nz); rough = 0.55; transl = 0.2; }
    // ---- 15 table wood ----
    if (uMat == 15) {
      vec3 base = vec3(0.070,0.052,0.040);
      float grain = sin((vW.z*2.0 + fbm(vec3(vW.x*30.0, vW.y*2.0, vW.z*2.0))*5.0)*26.0);
      base *= 0.85 + 0.3*smoothstep(-0.4,0.9,grain);
      base *= 0.9 + 0.2*nz2;
      albedo = base; rough = 0.78; spec = 0.06;
    }
    // ---- 16 dark iron ----
    if (uMat == 16) { albedo = vC.rgb*(0.8+0.4*nz); rough = 0.5; metal = 0.6; spec = 0.5; }
    // ---- 17 rope/string ----
    if (uMat == 17) { albedo = vC.rgb*(0.8+0.4*sin(vW.y*90.0)); rough = 0.9; }
    // ---- 18 crystal ----
    if (uMat == 18) { albedo = vec3(0.7,0.78,0.8); rough = 0.08; spec = 1.0; transl = 0.3; }
    // ---- 24 ground top (turf / dirt / sand / bed) ----
    if (uMat == 24) {
      float seas = uSeason.x;
      vec3 g1 = mix(vec3(0.235,0.265,0.135), vec3(0.20,0.245,0.125), smoothstep(0.0,0.25,seas));
      g1 = mix(g1, vec3(0.285,0.255,0.125), smoothstep(0.25,0.5,seas));
      g1 = mix(g1, vec3(0.315,0.275,0.155), smoothstep(0.72,0.92,seas));
      float dryM = smoothstep(0.55,0.9, fbm(vW*3.4));
      vec3 c = mix(g1, vC.rgb, 0.62);
      c = mix(c, g1*1.35 + vec3(0.06,0.05,0.0), dryM*0.5*seas);
      c *= 0.82 + 0.42*nz;
      albedo = c; rough = 0.94; transl = 0.10;
      if (frost > 0.01) albedo = mix(albedo, vec3(0.72,0.78,0.82), frost*0.55);
      if (snow > 0.02) albedo = mix(albedo, vec3(0.87,0.90,0.94), snow*0.92);
    }
    // ---- 23 inner atmosphere shell ----
    if (uMat == 23) {
      float hgt = clamp((vW.y - 0.4) / 7.0, 0.0, 1.0);
      vec3 lowC = mix(uGround.rgb*1.3, uSky.rgb*1.25, 0.6);
      vec3 highC = mix(uSky.rgb*2.0, vec3(0.80,0.85,0.95), 0.3);
      vec3 c = mix(lowC, highC, hgt);
      c = mix(c, uSunColor.rgb*0.22, uSeason.w*0.35);
      float haze = 0.55 + uMist.x*0.5 + uWeather.x*0.3;
      albedo = c * (0.85 + 0.3*nz); emis = c * 1.25 * haze;
      rough = 1.0;
      
    }
    // ---- 25 reeds ----
    if (uMat == 25) {
      float seas = uSeason.x;
      vec3 c = mix(vec3(0.20,0.26,0.10), vec3(0.30,0.26,0.13), smoothstep(0.28,0.55,seas));
      c = mix(c, vec3(0.35,0.30,0.17), smoothstep(0.72,0.95,seas));
      c = mix(c, vC.rgb, 0.4) * (0.6+0.7*vUV.y);
      albedo = c; rough = 0.8; transl = 0.4;
      if (snow > 0.02) albedo = mix(albedo, vec3(0.8,0.84,0.88), snow*0.5);
    }
    // ---- 26 flower ----
    if (uMat == 26) {
      float l = length((vUV-0.5)*2.0);
      if (l > 1.0) discard;
      vec3 c = vC.rgb;
      c = mix(c, vec3(0.25,0.22,0.05), smoothstep(0.30,0.14,l));
      c *= 0.75 + 0.5*l;
      albedo = c; rough = 0.6; transl = 0.5; emis = c*0.16;
      if (snow > 0.02) albedo = mix(albedo, vec3(0.8,0.84,0.88), snow*0.5);
    }
    // ---- 19 grass blade ----
    if (uMat == 19) {
      float seas = uSeason.x;
      vec3 c1 = mix(vec3(0.245,0.285,0.125), vec3(0.21,0.26,0.12), smoothstep(0.0,0.25,seas));
      c1 = mix(c1, vec3(0.31,0.28,0.13), smoothstep(0.25,0.5,seas));
      c1 = mix(c1, vec3(0.36,0.31,0.175), smoothstep(0.75,1.0,seas));
      c1 = mix(c1, vec3(0.44,0.38,0.20), smoothstep(0.5,0.64,seas)*(1.0-smoothstep(0.72,0.9,seas)));
      vec3 c = mix(c1, vC.rgb, 0.35) * (0.72 + 0.34*vUV.y);
      albedo = c; rough = 0.88; transl = 0.22;
      if (frost > 0.01) albedo = mix(albedo, vec3(0.7,0.75,0.8), frost*0.5*smoothstep(0.1,0.9,vUV.y));
      if (snow > 0.02) albedo = mix(albedo, vec3(0.85,0.88,0.92), snow*0.35);
    }
    // ---- 14 bark ----
    if (uMat == 14) {
      albedo = vC.rgb*(0.7+0.6*fbm(vec3(vW.x*30.0,vW.y*3.0,vW.z*30.0)));
      rough = 0.9;
    }

    // ---- painted detail texture (albedo + roughness break-up)
    if (uDetailAmt > 0.001) {
      vec3 d = detailTex(vW, N);
      float dl = dot(d, vec3(0.333));
      albedo *= mix(1.0, dl*2.35, uDetailAmt);
      rough = clamp(rough + (dl-0.5)*0.22*uDetailAmt, 0.05, 1.0);
      albedo = mix(albedo, albedo*vec3(0.86,0.9,1.0), (dl-0.5)*0.35);
    }
    // weather response
    albedo *= 1.0 - wet*0.30*smoothstep(0.30,0.0,rough);
    gloss = max(gloss, wet*0.7);
    float fogAmt = 1.0;

    vec3 L = normalize(uSunDir.xyz);
    float ndl = max(dot(N, L), 0.0);
    N = normalize(N + uSunDir.xyz * 0.0001);
    float sh = shadowAt(N) * (1.0 - cloudShade()*0.72);
    sh = mix(sh, 1.0, 0.0);
    vec3 amb = mix(uGround.rgb, uSky.rgb, 0.5+0.5*N.y);
    vec3 lit = amb * albedo * 1.35 * (0.85 + 0.5*N.y*0.5);
    vec3 sunCol = uSunColor.rgb;
    lit += sunCol * albedo * ndl * sh * fogAmt;
    // translucent foliage backlight
    if (transl > 0.0) {
      float back = max(dot(-N, L), 0.0);
      lit += sunCol * albedo * back * transl * 0.55 * sh;
    }
    // specular
    vec3 H = normalize(L + V);
    float nh = max(dot(N,H),0.0);
    float fres = pow(1.0-max(dot(N,V),0.0), 5.0);
    if (metal > 0.5) {
      vec3 refl = mix(uGround.rgb, uSky.rgb, 0.6+0.4*N.y);
      lit = mix(lit, refl*albedo, 0.35 + fres*0.35);
      lit += sunCol * pow(nh, 40.0/(rough*rough+0.05)) * sh * 1.6;
    } else {
      float sp = pow(nh, mix(8.0, 220.0, 1.0-rough));
      lit += sunCol * sp * spec * sh * (1.0+gloss*3.0);
      if (gloss > 0.05) {
        vec3 refl = mix(uGround.rgb*0.7, uSky.rgb, 0.7);
        lit += refl * fres * gloss * 0.55;
      }
    }
    // lightning
    vec3 fl = uFlashPos - vW;
    lit += vec3(0.62,0.70,1.0) * uFlashAmt * (0.55 + 0.45*max(dot(N, normalize(fl)),0.0)) / (1.0 + dot(fl,fl)*0.06);
    lit += emis;
    // distance + height haze
    float haze = 1.0 - exp(-vDist*vDist*0.00035);
    haze *= (1.0 - smoothstep(2.2, 6.0, vW.y)) * 0.45 + 0.55;
    haze *= 0.55 + uWeather.x*0.0 + 0.45;

(function () {
  const M = WG.m;

  const SUN_UP = [1.0, 0.975, 0.945], SUN_GOLD = [1.0, 0.80, 0.52], SUN_LOW = [1.0, 0.46, 0.22], MOON = [0.62, 0.74, 1.0];
  S.maxElev = function () {
    const s = WG.state.season;
    const tab = [47, 63, 45, 31];              // spring summer autumn winter
    const f = (s % 1) * 4, i = Math.floor(f), t = f - i;
    const a = tab[i % 4], b = tab[(i + 1) % 4];
    return (a + (b - a) * t) * Math.PI / 180;
  };
  S.update = function (dt) {
    const t = WG.state.time;
    const day = (t - 6) / 12;                  // 0..1 across daylight
    const maxE = S.maxElev();
    const elev = Math.sin(M.clamp(day, 0, 1) * Math.PI) * maxE * (day < 0 || day > 1 ? 0 : 1);
    const lowNight = day < 0 ? Math.max(-0.55, elev + day * 1.1) : day > 1 ? Math.max(-0.55, elev - (day - 1) * 1.1) : elev;
    S.elev = lowNight;
    S.az = (-70 + day * 104) * Math.PI / 180;
    const ce = Math.cos(lowNight);
    S.sunDir = [Math.sin(S.az) * ce, Math.sin(lowNight), Math.cos(S.az) * ce];

    // moon opposite
    S.moonElev = -lowNight * 0.82 + 0.10;
    const maz = S.az + Math.PI;
    const mce = Math.cos(S.moonElev);
    S.moonDir = [Math.sin(maz) * mce, Math.sin(S.moonElev), Math.cos(maz) * mce];

    const st = WG.state;
    const storm = st.storm || 0;
    const cover = M.sat(st.cloudCover * 0.85 + storm * 0.5);
    const dayF = M.sat((lowNight + 0.16) / 0.5);          // 0 night → 1 day
    const gold = M.sat(1 - Math.abs(lowNight - 0.14) / 0.34) * dayF;

    // sun colour
    let sc = M.lerp3(SUN_LOW, SUN_GOLD, M.sat(lowNight / 0.22));
    sc = M.lerp3(sc, SUN_UP, M.sat((lowNight - 0.22) / 0.42));

    const daySky = [0.33, 0.355, 0.385], duskSky = [0.20, 0.20, 0.32], nightSky = [0.055, 0.075, 0.13];
    let sky = M.lerp3(nightSky, [0.36, 0.38, 0.42], dayF);

  function jetty() {

    // mooring rope coil

  F.boat = { x: 0, z: 0 };

  /* ---- grass / flowers / reeds / pads ---- */
  F.grass = [];
  function grass() {
    const target = WG.detail >= 3 ? 120000 : WG.detail === 2 ? 60000 : 34000;
    const rnd = M.seed(1234);
    const inst = [];
    let tries = 0;
    while (inst.length < target * 16 && tries < target * 40) {
      tries++;
      const x = -5.95 + rnd() * 11.9, z = -3.95 + rnd() * 7.9;
      const y = L.h(x, z);
      const t = L.type(x, z, y);
      if (t !== 0 && t !== 6) continue;
      if (t === 6) { if (L.lakeMask(x, z) < -0.02 || y < 0.05) continue; }
      const sl = L.slope(x, z);
      if (sl > 1.05) continue;
      if (Math.hypot(x - CAB.x, z - CAB.z) < 0.55) continue;
      let dens = t === 6 ? 0.9 : 1;
      dens *= 1 - M.sat((y - 1.9) / 1.4) * 0.8;
      if (rnd() > dens) continue;
      const near = Math.min(...F.trees.map(tr => Math.hypot(x - tr.p[0], z - tr.p[2])));
      if (near < 0.35 && rnd() > 0.45) continue;
      const hgt = (0.045 + rnd() * 0.10) * (t === 6 ? 1.35 : 1);
      const c = rnd() > 0.88 ? G.hex('#a8a06a') : rnd() > 0.5 ? G.hex('#7f9a52') : G.hex('#6b8a45');
      inst.push(x, y - 0.01, z, hgt, rnd() * 6.283, c);
      if (inst.length > target * 16) break;
    }
    const n = inst.length / 6;
    const data = new Float32Array(n * 20);
    const m = M.mat4();
    for (let i = 0, o = 0; i < inst.length; i += 6, o += 20) {
      const sc = 0.75 + (inst[i + 3] * 7 % 0.4);
      M.trs([inst[i], inst[i + 1], inst[i + 2]], [0, inst[i + 4], 0], [sc * 0.85, inst[i + 3] / 0.62, sc * 0.85], m);
      data[o] = m[0]; data[o + 1] = m[1]; data[o + 2] = m[2]; data[o + 3] = m[12];
      data[o + 4] = m[4]; data[o + 5] = m[5]; data[o + 6] = m[6]; data[o + 7] = m[13];
      data[o + 8] = m[8]; data[o + 9] = m[9]; data[o + 10] = m[10]; data[o + 11] = m[14];
      data[o + 12] = inst[i + 5][0]; data[o + 13] = inst[i + 5][1]; data[o + 14] = inst[i + 5][2]; data[o + 15] = 1;
      data[o + 16] = 0; data[o + 17] = 1; data[o + 18] = 1; data[o + 19] = 0;
    }
    WG.R.addInstances('grassTuft', MAT.grass, data);
  }

  function flowers() {
    const kinds = [
      { c: '#e8e4dc', tip: '#d98aa8', n: 1 }, { c: '#e8c22a', tip: '#e8c22a', n: 1 },
      { c: '#7a5fc0', tip: '#9a7fe0', n: 1 }, { c: '#c8322a', tip: '#3a1a16', n: 1 }
    ];
    const patches = [[-4.2, 2.4], [-3.6, 0.4], [-1.8, 2.9], [1.6, -0.4], [4.3, 1.2], [-0.6, -1.4]];
    const rnd = M.seed(77);
    const data = [];
    const m = M.mat4();
    for (let pi = 0; pi < patches.length; pi++) {
      const [px, pz] = patches[pi];
      const kind = kinds[pi % kinds.length];
      const cnt = WG.detail >= 3 ? 150 : WG.detail === 2 ? 90 : 40;
      for (let i = 0; i < cnt; i++) {
        const a = rnd() * 6.283, r = Math.sqrt(rnd()) * 0.85;
        const x = px + Math.cos(a) * r, z = pz + Math.sin(a) * r;
        const y = L.h(x, z);
        if (L.type(x, z, y) !== 0) continue;
        const s = 0.028 + rnd() * 0.02;
        M.trs([x, y + 0.075 + rnd() * 0.04, z], [0, 0, 0], [s, s, 1], m);
        const cc = G.hex(kind.c);
        data.push(m[0], m[1], m[2], m[12], m[4], m[5], m[6], m[13], m[8], m[9], m[10], m[14],
          cc[0], cc[1], cc[2], 1, 1, 0.3, s, 0);
      }
    }
    WG.R.addInstances('sprite', MAT.flower, new Float32Array(data));
    F.patches = patches;
  }

  function reeds() {
    const rnd = M.seed(303);
    const data = [];
    const m = M.mat4();
    const spots = [];
    for (let i = 0; i < 26; i++) {
      const a = rnd() * 6.283, rr = 2.05 + rnd() * 0.5;
      const x = 2.75 + Math.cos(a) * rr, z = 2.65 + Math.sin(a) * rr * 0.8;
      if (x < -5.8 || x > 5.8 || z > 3.8) continue;
      if (L.lakeMask(x, z) > 0.25 && L.lakeMask(x, z) < 0.9) spots.push([x, z]);
    }
    for (const [cx, cz] of spots) {
      for (let i = 0; i < 9; i++) {
        const x = cx + (rnd() - 0.5) * 0.28, z = cz + (rnd() - 0.5) * 0.2;
        const y = Math.max(L.h(x, z), 0.02);
        const hh = 0.13 + rnd() * 0.17;
        M.trs([x, y, z], [0, rnd() * 6.28, 0], [1, hh / 0.12, 1], m);
        data.push(m[0], m[1], m[2], m[12], m[4], m[5], m[6], m[13], m[8], m[9], m[10], m[14],
          0.34, 0.40, 0.20, 1, 0, 1, 1, 0);
        if (rnd() > 0.86) {
          const b = G.hex('#6b4a2a');
          M.trs([x, y + hh, z], [0, 0, 0], [0.5, 0.5, 1], m);
          data.push(m[0], m[1], m[2], m[12], m[4], m[5], m[6], m[13], m[8], m[9], m[10], m[14], b[0], b[1], b[2], 1, 1, 0.2, 0.022, 1);
        }
      }
    }
    WG.R.addInstances('grassTuft', MAT.reeds, new Float32Array(data));
  }

  F.build = function () {
    const rnd = M.seed(4242);
    cabin(); jetty(); boat();
    // pines on the back slopes and shoulders
    const pineN = WG.detail >= 3 ? 26 : WG.detail === 2 ? 21 : 16;
    let placed = 0, guard = 0;
    while (placed < pineN && guard++ < 900) {
      const x = -5.6 + rnd() * 11.2, z = -3.7 + rnd() * 2.6;
      const y = L.h(x, z);
      if (y < 1.15 || L.slope(x, z) > 1.3) continue;
      if (Math.hypot(x - CAB.x, z - CAB.z) < 1.0) continue;
      if (Math.hypot(x - 2.75, z - 2.65) < 1.3) continue;
      tree('pine', x, z, 0.55 + rnd() * 0.75 - Math.max(0, (y - 2) * 0.12), (placed * 91 + 5) | 0);
      placed++;
    }
    // broadleaf groves
    const spots = [[-5.2, 2.2], [-4.6, 0.9], [-4.0, 0.2], [-3.3, -0.6], [-5.4, 1.1], [-2.2, -1.6],
      [4.6, 0.6], [5.1, 1.5], [5.3, -0.6], [4.2, 1.9], [-1.2, 2.9], [-4.7, 2.9], [5.4, 2.6]];
    let bl = 0;
    const blN = WG.detail >= 3 ? 15 : WG.detail === 2 ? 12 : 9;
    for (let i = 0; i < spots.length && bl < blN; i++) {
      const [sx, sz] = spots[i];
      const x = sx + (rnd() - 0.5) * 0.5, z = sz + (rnd() - 0.5) * 0.5;
      const y = L.h(x, z);
      if (y < 0.15 || L.lakeMask(x, z) > -0.1 || L.slope(x, z) > 0.9) continue;
      tree(rnd() > 0.55 ? 'oak' : 'birch', x, z, 0.7 + rnd() * 0.35, (bl * 37 + 11) | 0);
      bl++;
    }
    tree('oak', -4.0, 0.25, 1.25, 999);
    tree('birch', -4.95, 1.5, 1.15, 998);
    tree('cherry', -3.75, 2.4, 0.85, 997);
    tree('cherry', 3.3, 0.35, 0.8, 996);
    // bushes
    const bn = WG.detail >= 3 ? 30 : WG.detail === 2 ? 22 : 14;
    for (let i = 0; i < bn; i++) {
      const x = -5.7 + rnd() * 11.4, z = -3.6 + rnd() * 7.2;
      const y = L.h(x, z);
      if (L.lakeMask(x, z) > -0.15 || y < 0.2 || L.slope(x, z) > 1.0) continue;
      if (Math.hypot(x - CAB.x, z - CAB.z) < 0.75) continue;
      bush(x, z, (i * 53 + 3) | 0, rnd() > 0.72);
    }
    // perches from treetops
    for (const t of F.trees) {
      if (t.h > 0.55) WG.scene.perches.push({ p: t.p, safe: t.kind === 'pine', kind: 'tree' });
    }
    for (let i = 0; i < 6; i++) {
      const x = -4.1 + i * 0.16, z = 0.5 + i * 0.13;
      WG.scene.perches.push({ p: [x, L.h(x, z) + 0.22, z], safe: false, kind: 'fence' });
    }
    grass(); flowers(); reeds();
  };
  F.CAB = CAB;
})();

/* ===== 50_particles.js ===== */
/* 50_particles.js — pooled particles */
(function () {
  const M = WG.m, MAT = WG.MAT;
  const P = WG.particles = { list: [], pool: [] };
  const MAX = 4000;

  function take() { return P.pool.pop() || {}; }
  WG.spawn = function (kind, x, y, z, opts) {
    if (P.list.length > MAX) return null;
    const p = take();
    p.kind = kind; p.x = x; p.y = y; p.z = z;
    p.vx = opts && opts.vx || 0; p.vy = opts && opts.vy || 0; p.vz = opts && opts.vz || 0;
    p.life = p.max = (opts && opts.life) || 1;
    p.size = (opts && opts.size) || 0.05;
    p.g = opts && opts.g != null ? opts.g : 0;
    p.drag = (opts && opts.drag) || 0;
    p.seed = Math.random() * 6.28;
    p.spin = (Math.random() - 0.5) * 2;
    p.col = (opts && opts.col) || null;
    p.flip = 0;
    P.list.push(p);
    return p;
  };

  P.clear = function () { for (const p of P.list) P.pool.push(p); P.list.length = 0; };

  P.update = function (dt) {
    const st = WG.state;
    const wx = Math.cos(st.windAngle) * st.wind, wz = Math.sin(st.windAngle) * st.wind;
    const L = P.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L.splice(i, 1); P.pool.push(p); continue; }
      switch (p.kind) {
        case 'rain':
          p.vy -= 9.5 * dt;
          p.vx += (wx * 1.6 - p.vx * p.drag) * dt;
          p.vz += (wz * 1.6 - p.vz * p.drag) * dt;
          if (p.y <= p.ground + 0.02) {
            WG.spawn('ring', p.x, p.ground + 0.012, p.z, { life: 0.55, size: 0.10 + Math.random() * 0.09 });
            p.life = 0;
          }
          break;
        case 'snow':
          p.vy = -0.32 + Math.sin(WG.time * 3 + p.seed) * 0.10;
          p.vx += (wx * 1.4 - p.vx * p.drag) * dt;
          p.vz += (wz * 1.4 - p.vz * p.drag) * dt;
          if (p.y <= p.ground + 0.02) p.life = 0;
          break;
        case 'leaf':
        case 'petal':
          p.vy -= 1.6 * dt; p.vy = Math.max(p.vy, -0.55);
          p.vx += (wx * 3.2 - p.vx) * dt * 1.4;
          p.vz += (wz * 3.2 - p.vz) * dt * 1.4;
          p.flip += p.spin * dt * 5;
          if (p.y <= p.ground + 0.02) { p.life = Math.min(p.life, 1.6); p.vy = 0; p.vx *= 0.9; p.vz *= 0.9; p.g = 0; }
          break;
        case 'spark':
          p.vy -= 3.2 * dt; p.g = 3.2;
          break;
        case 'crown':
        case 'ring':
        case 'splash':
          break;
        case 'smoke':
          p.vy += 0.10 * dt;
          p.vx += (wx * 1.05 + Math.sin(WG.time * 1.3 + p.seed) * 0.06 - p.vx) * dt * 0.7;
          p.vz += (wz * 1.05 - p.vz) * dt * 0.7;
          p.size += dt * 0.016;
          break;
        case 'mist':
          p.vx += (wx * 0.7 - p.vx) * dt * 0.6;
          p.vz += (wz * 0.7 - p.vz) * dt * 0.6;
          p.y += Math.sin(WG.time * 0.6 + p.seed) * dt * 0.03;
          p.size += dt * 0.05;
          break;
        case 'dust':
          p.vx = Math.sin(WG.time * 0.7 + p.seed) * 0.06;
          p.vy = Math.cos(WG.time * 0.9 + p.seed) * 0.04;
          break;
        case 'spray':
          p.vy -= 3.4 * dt;
          if (p.y <= p.ground) p.life = 0;
          break;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.x = M.clamp(p.x, -5.9, 5.9); p.z = M.clamp(p.z, -3.9, 3.9); p.y = Math.min(p.y, 7.2);
    }
    if (L.length > MAX) L.length = MAX;
  };

  P.draw = function () {
    const gl = WG.R.gl;
    const L = P.list;
    if (!L.length) return;
    gl.uniform1i(WG.R.pUnlit.u.uMode, 0);
    const m = M.mat4();
    for (const p of L) {
      const t = p.life / p.max;
      const fade = Math.min(1, t * 2.2) * Math.min(1, (p.max - p.life) * 6 + 0.2);
      let size = p.size, col, mode = 0;
      switch (p.kind) {
        case 'rain': col = [0.62, 0.72, 0.82, 0.55]; size = 0.055; mode = 1; break;
        case 'snow': col = [0.92, 0.94, 0.98, 0.85]; mode = 0; break;
        case 'ring': col = [0.72, 0.85, 0.9, 0.5 * t]; size *= (1.4 - t) * 1.2; mode = 2; break;
        case 'crown': col = [0.8, 0.9, 0.95, 0.7 * t]; size *= (1.3 - t * 0.6); mode = 2; break;
        case 'spray': case 'splash': col = [0.82, 0.92, 0.96, 0.8 * t]; mode = 0; break;
        case 'spark': col = [1.0, 0.85 * t + 0.2, 0.35 * t, 1]; size *= 0.6; mode = 0; break;
        case 'leaf': case 'petal':
          col = p.col ? [p.col[0], p.col[1], p.col[2], 0.95] : [0.5, 0.3, 0.1, 0.9]; mode = 3; break;
        case 'smoke': col = [0.78, 0.77, 0.74, 0.24 * Math.min(1, t * 1.5)]; mode = 3; break;
        case 'mist': col = [0.9, 0.93, 0.96, 0.16 * Math.min(1, t * 1.6)]; mode = 3; break;
        case 'dust': col = [1.0, 0.96, 0.85, 0.5]; mode = 0; break;
        default: col = [1, 1, 1, 1];
      }
      if (mode === 1) {
        M.trs([p.x, p.y, p.z], [0, 0, Math.atan2(p.vx, p.vy) * 0.35], [1, 1, 1], m);
        WG.R.push('sprite', MAT.particles, m, col, [1, 0, size, 0]);
      } else if (mode === 2) {
        M.trs([p.x, p.y, p.z], [0, 0, 0], [size, size * 0.55, 1], m);
        WG.R.push('rippleRing', MAT.particles, m, col, [1, 0, 1, 0]);
      } else {
        M.trs([p.x, p.y, p.z], [0, p.flip, 0], [size, size * (p.kind === 'leaf' || p.kind === 'petal' ? 1.5 : 1), 1], m);
        WG.R.push('sprite', MAT.particles, m, col, [1, 0, 1, 0]);
      }
    }
  };
})();

/* 55_clouds.js — clouds: physics, rendering, weather */
(function () {
  const M = WG.m, R = WG.R, MAT = WG.MAT;
  const C = WG.clouds = { list: [], grabbed: null, holdT: 0, hovered: null };
  const B = { x: 5.55, y0: 1.9, y1: 6.95, z: 3.55 };

  function makeLobe(cl, i) {
    const a = (i / 11) * 6.283 + Math.random() * 0.7;
    const r = 0.30 + Math.random() * 0.72;
    return {
      a, d: r, y: (Math.random() - 0.42) * 0.85, r: 0.55 + Math.random() * 0.55,
      ox: 0, oy: 0, oz: 0, vx: 0, vy: 0, vz: 0, ph: Math.random() * 9
    };
  }
  C.spawn = function (x, y, z, water, seed) {
    if (C.list.length > 10) C.dissolve(C.list[0]);
    const cl = {
      x, y, z, tx: x, ty: y, tz: z, vx: 0, vy: 0, vz: 0,
      water: water || 0.25, wet: 0, sq: 0, sqT: 0, shake: 0, shakePhase: 0, shakeAcc: 0,
      charge: 0, flash: 0, r: 0.55, alpha: 0, state: 'dry', storm: 0, rain: 0,
      age: 0, hold: 0, held: false, seed: seed || Math.random() * 100,
      tower: 0, anvil: 0, bob: Math.random() * 6.28, lobes: []
    };
    for (let i = 0; i < 9; i++) cl.lobes.push(makeLobe(cl, i));
    cl.r = 0.5 + water * 0.45 + Math.random() * 0.2;
    C.list.push(cl);
    return cl;
  };
  C.dissolve = function (cl) { cl.dying = true; };
  C.remove = function (cl) { const i = C.list.indexOf(cl); if (i >= 0) C.list.splice(i, 1); if (C.grabbed === cl) C.grabbed = null; };

  C.grab = function (cl) {
    C.grabbed = cl; cl.held = true; cl.hold = 0;
    WG.events.emit('tut:grab');
    if (WG.audio) WG.audio.event('grab', { size: cl.r });
  };
  C.release = function () {
    const cl = C.grabbed;
    if (!cl) return;
    cl.held = false;
    C.grabbed = null;
    cl.vx *= 1.35; cl.vz *= 1.35;
    if (WG.audio) WG.audio.event(cl.sq > 0.3 ? 'release' : 'release', { wet: cl.sq });
    cl.sqT = 0;
    // merge test
    for (const o of C.list) {
      if (o === cl) continue;
      if (Math.hypot(o.x - cl.x, o.y - cl.y, o.z - cl.z) < (o.r + cl.r) * 0.9) { C.merge(cl, o); break; }
    }
    if (WG.events) WG.events.emit('cloudRelease');
  };
  C.merge = function (a, b) {
    const big = a.water >= b.water ? a : b, small = big === a ? b : a;
    big.water = Math.min(1.6, big.water + small.water * 0.85);
    big.r = Math.min(2.4, Math.sqrt(big.r * big.r + small.r * small.r * 0.8));
    big.vx = (big.vx + small.vx) * 0.5; big.vz = (big.vz + small.vz) * 0.5;
    big.shake = Math.max(big.shake, 0.9);
    big.pop = 1;
    for (let i = 0; i < 4; i++) { const l = makeLobe(big, i + 9); big.lobes.push(l); }
    if (WG.audio) WG.audio.event('merge', { size: big.r });
    C.remove(small);
    if (big.water > 1.05 && big.r > 1.25 && big.storm < 0.2) { big.storm = 0.05; big.strikeT = 4; }
    if (WG.events) WG.events.emit('cloudMerge');
  };

  C.update = function (dt) {
    const st = WG.state;
    const wx = Math.cos(st.windAngle) * st.wind, wz = Math.sin(st.windAngle) * st.wind;
    for (let i = C.list.length - 1; i >= 0; i--) {
      const cl = C.list[i];
      cl.age += dt;
      cl.alpha = M.approach(cl.alpha, cl.dying ? 0 : 1, dt * (cl.dying ? 0.85 : 1.4));
      if (cl.dying && cl.alpha <= 0.02) { C.remove(cl); continue; }
      if (cl.pop) cl.pop = Math.max(0, cl.pop - dt * 2.2);

      if (cl.held) {
        cl.hold += dt;
        cl.tx = M.clamp(cl.tx, -B.x, B.x); cl.ty = M.clamp(cl.ty, B.y0, B.y1); cl.tz = M.clamp(cl.tz, -B.z, B.z);
      } else {
        cl.tx += wx * 0.32 * (0.6 + 0.4 / (1 + cl.r)) * dt * 5;
        cl.tz += wz * 0.32 * (0.6 + 0.4 / (1 + cl.r)) * dt * 5;
        if (cl.tx > B.x || cl.tx < -B.x) cl.vx *= -0.45;
        if (cl.tz > B.z || cl.tz < -B.z) cl.vz *= -0.45;
        if (cl.ty > B.y1) cl.ty = B.y1;
        if (cl.ty < B.y0) cl.ty = B.y0;
      }
      // spring toward target
      const k = cl.held ? 15 : 2.2;
      cl.vx += (cl.tx - cl.x) * k * dt * 3.2;
      cl.vz += (cl.tz - cl.z) * k * dt * 3.2;
      cl.vy += (cl.ty - cl.y) * k * dt * 3.2;
      cl.bob = Math.sin(WG.time * 0.8 + cl.seed) * 0.035;
      cl.vy += cl.bob * dt * 2;
      const damp = Math.exp(-(cl.held ? 6.5 : 1.6) * dt);
      cl.vx *= damp; cl.vy *= damp; cl.vz *= damp;
      cl.x = M.clamp(cl.x + cl.vx * dt, -B.x, B.x);
      cl.z = M.clamp(cl.z + cl.vz * dt, -B.z, B.z);
      cl.y = M.clamp(cl.y + cl.vy * dt, B.y0, B.y1);

      // squeeze
      const wasSq = cl.sq;
      if (cl.held && cl.hold > 0.18 && Math.abs(cl.vx) + Math.abs(cl.vz) < 1.1) cl.sqT = Math.min(1, cl.sqT + dt / 1.9);
      else cl.sqT = Math.max(0, cl.sqT - dt / 1.1);
      cl.sq = M.damp(cl.sq, cl.sqT, 7, dt);
      if (cl.sq > 0.12 && wasSq < 0.5) { WG.events.emit('tut:squeeze'); if (WG.audio) WG.audio.event('squeezeStart'); }
      if (cl.sq > 0.5) cl.water = Math.max(0, cl.water - dt * 0.30 * cl.sq);
      // wetness from rain state
      const target = M.sat(cl.water * 0.72 + cl.sq * 0.45 + st.humidity * 0.25);
      cl.wet = M.damp(cl.wet, target, 1.6, dt);
      cl.rain = M.damp(cl.rain, M.sat(cl.sq * 1.15 + (cl.storm > 0.3 ? 0.65 : 0)) , 3, dt);
      if (cl.water < 0.05 && !cl.held) C.dissolve(cl);
      // humid refill / dry out
      const sun = WG.sky.sunI * 0.5;
      cl.water += (st.humidity * 0.10 - sun * 0.05) * dt * 0.4;
      cl.water = M.sat(cl.water);
      // storm growth
      if (cl.storm > 0) {
        cl.storm = M.sat(cl.storm + dt * 0.35);
        cl.tower = M.approach(cl.tower, 1, dt * 0.5);
        cl.anvil = M.approach(cl.anvil, 1, dt * 0.4);
        cl.strikeT = (cl.strikeT || 6) - dt;
        if (cl.strikeT < 0 && cl.water > 0.25) { cl.strikeT = 10 + Math.random() * 5; C.strike(cl); }
        cl.ty = B.y0;
        cl.water = Math.max(0, cl.water - dt * 0.02);
        if (cl.water <= 0.001 && !cl.held) { cl.storm = 0; C.dissolve(cl); }
      }
      cl.shake = Math.max(0, cl.shake - dt * 1.6);
      cl.flash = Math.max(0, cl.flash - dt * 3);
      // rain emission
      if (cl.rain > 0.04 && cl.alpha > 0.4) {
        const n = Math.round(cl.rain * 26 * dt * (WG.detail >= 3 ? 1.6 : 1) * 60 / 60 * (WG.state.temperature < 0.6 ? 0.55 : 1));
        for (let j = 0; j < Math.max(1, n); j++) {
          const a = Math.random() * 6.283, rr = Math.sqrt(Math.random()) * cl.r * 1.1;
          const gx = cl.x + Math.cos(a) * rr, gz = cl.z + Math.sin(a) * rr;
          if (Math.abs(gx) > 5.85 || Math.abs(gz) > 3.85) continue;
          const cold = WG.state.temperature < 0.6;
          WG.spawn(cold ? 'snow' : 'rain', gx, cl.y - cl.r * 0.55, gz, {
            vy: cold ? -0.25 : -1.2, life: cold ? 9 : 3.4, size: cold ? 0.035 : 0.05, drag: 1.2,
            g: WG.land.h(gx, gz) + 0.02
          });
        }
      }
      // lobes
      for (const l of cl.lobes) {
        const wob = Math.sin(WG.time * 1.7 + l.ph) * 0.05 + cl.shake * Math.sin(WG.time * 26 + l.ph) * 0.09;
        const sqk = cl.sq;
        const ox = Math.cos(l.a) * cl.r * (0.35 + l.d * 0.75) * (1 + sqk * 0.5) + wob;
        const oy = l.y * cl.r * (0.55 + l.r * 0.4) * (1 - sqk * 0.55) + wob * 0.4;
        const oz = Math.sin(l.a) * cl.r * (0.35 + l.d * 0.75) * (1 + sqk * 0.5) + wob;
        l.vx += (ox - l.ox) * 60 * dt; l.vy += (oy - l.oy) * 60 * dt; l.vz += (oz - l.oz) * 60 * dt;
        l.vx *= 0.86; l.vy *= 0.86; l.vz *= 0.86;
        l.ox += l.vx * dt; l.oy += l.vy * dt; l.oz += l.vz * dt;
        l.ox = M.clamp(l.ox, -cl.r * 1.6, cl.r * 1.6);
        l.oy = M.clamp(l.oy, -cl.r * 0.9, cl.r * 1.2);
        l.oz = M.clamp(l.oz, -cl.r * 1.6, cl.r * 1.6);
      }
      // cover bookkeeping
      st.cloudCover = M.clamp(st.cloudCover * 0.94 + (C.list.reduce((a, c) => a + c.r * c.r, 0) / 90) * 0.06, 0, 1);
    }
    if (C.list.length > 10) C.dissolve(C.list[0]);
    C.holdT += dt;
  };

  C.strike = function (cl) {
    // pick a target: tallest tree under the cloud, else high ground, else lake
    let target = null;
    let best = 0.55;
    for (const t of (WG.flora.trees || [])) {
      const d = Math.hypot(t.p[0] - cl.x, t.p[2] - cl.z);
      if (d < cl.r * 2.4 && t.h > best) { best = t.h; target = t.p; }
    }
    if (!target) {
      let hx = cl.x, hz = cl.z, hy = -9;
      for (let i = 0; i < 24; i++) {
        const a = Math.random() * 6.283, rr = Math.random() * cl.r * 1.8;
        const x = M.clamp(cl.x + Math.cos(a) * rr, -5.8, 5.8), z = M.clamp(cl.z + Math.sin(a) * rr, -3.8, 3.8);
        const y = WG.land.h(x, z);
        if (y > hy) { hy = y; hx = x; hz = z; }
      }
      target = [hx, hy, hz];
    }
    WG.sim.strike(cl, target);
    cl.flash = 1; cl.charge = 1;
  };

  /* ---- rendering ---- */
  C.draw = function () {
    const st = WG.state;
    const night = M.sat(1 - WG.sky.elev * 4.5);
    const gold = M.sat(WG.sky.warm || 0);
    const m = M.mat4();
    for (const cl of C.list) {
      if (cl.alpha <= 0.02) continue;
      const dark = M.sat(cl.wet * 0.85 + cl.sq * 0.35 + cl.storm * 0.9);
      let col;
      const base = M.lerp3([1.0, 1.0, 1.0], [0.42, 0.45, 0.5], dark);
      const peach = M.lerp3([1.0, 0.70, 0.56], [0.62, 0.58, 0.78], dark);
      col = M.lerp3(base, peach, gold * 0.85);
      col = M.lerp3(col, [0.34, 0.42, 0.56], night * 0.85);
      if (cl.storm > 0.2) col = M.lerp3(col, [0.20, 0.22, 0.245], cl.storm);
      const dens = 0.35 + dark * 0.6;
      C.lastCol = col;
      const a = cl.alpha * (0.55 + cl.alpha * 0.45);
      const shrink = 1 - cl.sq * 0.22;
      const sxz = 1 + cl.sq * 0.18;
      for (const l of cl.lobes) {
        const r = cl.r * l.r * 0.72 * shrink;
        if (r < 0.02) continue;
        M.trs([cl.x + l.ox, cl.y + l.oy, cl.z + l.oz], [0, l.ph, 0], [r * sxz, r * 0.9, r * sxz], m);
        R.push('cloudLobe', MAT.cloud, m, [col[0], col[1], col[2], dens], [0, cl.seed + l.ph, cl.flash * (0.5 + Math.random() * 0.5), a]);
      }
      // storm tower + anvil
      if (cl.tower > 0.05) {
        for (let i = 0; i < 4; i++) {
          const f = i / 4, r = cl.r * (0.55 - f * 0.3) * cl.tower;
          M.trs([cl.x + Math.sin(cl.seed + i) * 0.1, cl.y + cl.r * (0.5 + f * 3.0), cl.z], [0, 0, 0], [r, r * 1.3, r], m);
          R.push('cloudLobe', MAT.cloud, m, [col[0] * 0.92, col[1] * 0.92, col[2] * 0.95, dens], [0, cl.seed + i, cl.flash, a * 0.9]);
        }
      }
      if (cl.anvil > 0.05) {
        for (let i = 0; i < 6; i++) {
          const a2 = i / 6 * 6.283;
          const rr = cl.r * (0.9 + cl.anvil * 0.7);
          M.trs([cl.x + Math.cos(a2) * rr, 6.9 - Math.sin(WG.time + i) * 0.05, cl.z + Math.sin(a2) * rr * 0.8], [0, 0, 0], [cl.r * 0.7, cl.r * 0.16, cl.r * 0.7], m);
          R.push('cloudLobe', MAT.cloud, m, [col[0] * 0.9, col[1] * 0.9, col[2] * 0.92, dens * 0.9], [0, cl.seed + i * 2, cl.flash, a * 0.85]);
        }
      }
    }
    R.flush(m => m === MAT.cloud);
    if (C.bolts) C.bolts();
  };

  C.cover = [];
  C.drawCover = function () {
    if (!C.cover.length) return;
    const m = M.mat4();
    for (const c of C.cover) {
      M.trs([c.x, 0, c.z], [0, 0, 0], [1, 1, 1], m);
      R.push('sprite', MAT.cover, m, [1, 1, 1, c.a], [0, 0, c.r, 1]);
    }
    C.cover.length = 0;
    R.flush(m => m === MAT.cover);
  };
  C.calcCover = function () {
    C.cover.length = 0;
    for (const cl of C.list) {
      if (cl.alpha < 0.3) continue;
      const a = 0.10 + cl.wet * 0.35 + cl.storm * 0.25;
      C.cover.push({ x: cl.x, z: cl.z, r: cl.r * 1.5, a: a * cl.alpha });
      C.cover.push({ x: cl.x, z: cl.z, r: cl.r * 2.4, a: a * 0.5 * cl.alpha });
    }
  };

  C.init = function () {
    C.list.length = 0;
    C.spawn(-2.6, 5.4, -0.6, 0.22, 12);
    C.spawn(0.9, 6.0, 1.1, 0.18, 44);
    C.spawn(3.3, 5.2, -1.4, 0.16, 77);
  };
  C.reset = function () { C.list.length = 0; };
})();

/* ===== 60_sim.js ===== */
/* 60_sim.js — climate simulation: temperature, humidity, wind, water, fog, mist, lightning */
(function () {
  const M = WG.m, R = WG.R, MAT = WG.MAT;
  const S = WG.sim = {};
  let seasonT = 0, timeScale = 1;
  const SEASON_WORD = ['Spring', 'Summer', 'Autumn', 'Winter'];

  S.init = function () {
    WG.state.seasonName = 'Spring';
    WG.state.weather = 'sunny';
    WG.state.fog = 0; S.boltList = []; S.boltT = 0;
    S.waterLevel = 0; S.frozenT = 0; S.snowT = 0;
    S.windGust = 0; S.windT = 0; S.windPush = 0; S.tempBias = 0; S.snowRate = 0; S.windDir = 0.6;
    S.lightningT = 8 + Math.random() * 6;
    S.strikeSeq = [];
    WG.flashPos = [0, 4, 0];
    S.rainLevel = 0;
    S.gaugeH = 0.42; S.gaugeT = 0.55;
    S.gaugeHit = 0;
  };

  S.strike = function (cl, target) {
    WG.flashPos = target.slice();
    S.strikeSeq = [];
    let t = 0;
    for (let i = 0; i < 4; i++) { S.strikeSeq.push({ t: t, a: [1, 0.85, 0.6][i] * 0.75 }); t += 0.07 + (i % 2) * 0.11; }
    S.boltT = 0;
    // build the bolt path
    const pts = [];
    const top = [cl.x + (Math.random() - 0.5) * 0.3, cl.y - cl.r * 0.5, cl.z + (Math.random() - 0.5) * 0.3];
    pts.push(top);
    let cur = top.slice();
    let trunk = [];
    const segs = 7;
    for (let i = 1; i <= segs; i++) {
      const k = i / segs;
      cur = [M.lerp(top[0], target[0], k) + (Math.random() - 0.5) * 0.5 * (1 - k * 0.4),
      M.lerp(top[1], target[1], k), M.lerp(top[2], target[2], k) + (Math.random() - 0.5) * 0.5 * (1 - k * 0.4)];
      trunk.push(cur);
    }
    S.bolt = { pts: [top].concat(trunk), forks: [] };
    for (let f = 0; f < 2 + (Math.random() * 2 | 0); f++) {
      const i0 = 2 + (Math.random() * (trunk.length - 3) | 0);
      const a = trunk[i0];
      const br = [a.slice()];
      let p = a.slice();
      for (let i = 1; i < 3; i++) {
        p = [p[0] + (Math.random() - 0.5) * 0.9, p[1] - (a[1] - target[1]) * 0.22, p[2] + (Math.random() - 0.5) * 0.9];
        br.push(p);
      }
      S.bolt.forks.push(br);
    }
    WG.cam.kick(0.85);
    WG.state.flash = 1;
    if (WG.animals) WG.animals.flush();
    const dist = M.dist(WG.cam.pos, target) / 30;
    if (WG.audio) WG.audio.event('lightning', { dist: M.sat(dist) });
    // scorch / splash
    const onLake = WG.land.lakeMask(target[0], target[2]) > 0 && target[1] < 0.4;
    if (onLake) {
      for (let i = 0; i < 26; i++) WG.spawn('spray', target[0] + (Math.random() - 0.5) * 0.3, 0.12, target[2] + (Math.random() - 0.5) * 0.3,
        { vx: (Math.random() - 0.5) * 2.4, vy: 1.6 + Math.random() * 2.2, vz: (Math.random() - 0.5) * 2.4, life: 0.9, size: 0.05, ground: 0.1 });
      WG.spawn('ring', target[0], 0.115, target[2], { life: 1.7, size: 0.5 });
      WG.events.emit('splash', { x: target[0], z: target[2] });
    } else {
      for (let i = 0; i < 18; i++) WG.spawn('spark', target[0], target[1] + 0.05, target[2],
        { vx: (Math.random() - 0.5) * 2.2, vy: 0.8 + Math.random() * 1.9, vz: (Math.random() - 0.5) * 2.2, life: 0.8 + Math.random() * 0.7, size: 0.04 });
      S.scorch = { x: target[0], y: target[1], z: target[2], t: 2.4 };
      for (let i = 0; i < 6; i++) WG.spawn('smoke', target[0], target[1] + 0.05, target[2], { vy: 0.3, life: 1.6, size: 0.05 });
    }
    WG.state.humidity = M.sat(WG.state.humidity + 0.05);
  };

  S.update = function (dt) {
    const st = WG.state;
    // ---- time
    if (WG.playingTime) st.time = (st.time + dt * (24 / 300)) % 24;
    const season = st.season;
    st.seasonName = SEASON_WORD[Math.floor(((season + 0.125) % 1) * 4)];
    const dayN = M.sat(Math.sin((st.time - 6) / 12 * Math.PI) * 2.4);
    const nightK = 1 - dayN;

    // ---- wind
    const seasonWind = [0.16, 0.11, 0.30, 0.36][Math.floor(((season + 0.125) % 1) * 4)];
